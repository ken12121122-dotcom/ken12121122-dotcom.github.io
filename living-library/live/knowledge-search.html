<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e7d8b7"><title>正式 MD 搜尋｜念動圖書館</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:clamp(15px,4vw,26px);background:radial-gradient(circle at 25% 15%,#fff8e5,#e9d7b2 70%);color:#513c28;font:15px/1.65 "Noto Sans TC",system-ui,sans-serif}main{max-width:620px;margin:auto;border:2px solid #ae8c58;background:#f6eacb;border-radius:17px;padding:clamp(16px,4vw,25px);box-shadow:inset 0 0 0 5px #eadab7}header{border-bottom:2px solid #b89a66;padding-bottom:12px}.eyebrow{font-size:11px;letter-spacing:.12em;color:#7b603b}h1{font:700 clamp(22px,6vw,31px)/1.35 "Noto Serif TC",serif;margin:7px 0}p{color:#715b3e;margin:10px 0 20px}.card-action{display:block;text-align:left;width:100%;margin:10px 0;padding:14px;border:1px solid #aa8959;border-radius:12px;background:linear-gradient(145deg,#fff7df,#e5d09c);color:#513a22;cursor:pointer}.card-action b{display:block;font-size:16px}.card-action small{display:block;font-size:12px;color:#6e573d;margin-top:3px}.card-action:focus-visible{outline:3px solid #326e72;outline-offset:2px}.foot{font-size:12px;border-left:3px solid #987a4c;padding:9px 12px;background:#e8d3a4;margin-top:16px}</style></head>
<body><main><header><div class="eyebrow">⌕　知識世界 · 索引卡</div><h1>正式 MD 搜尋</h1></header><p>搜尋正式知識需要先連接 GEN2 私有來源。搜尋在念動圖書館本機授權工作區執行，不會將私人文件公開到這張卡片。</p><nav aria-label="卡片操作"><button class="card-action" type="button" data-action="open-md-search"><b>⌕ 搜尋正式 MD</b><small>開啟已授權來源的文件關鍵字搜尋</small></button>
<button class="card-action" type="button" data-action="connect-gen2"><b>✦ 連接 GEN2</b><small>尚未連線時，前往正式來源授權</small></button></nav><div class="foot">本頁只是書內操作介面；實際權限、驗證與更新由圖書館主頁負責，不在公開網頁保存私人憑證。</div></main>
<script>
document.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
 const action=button.dataset.action;
 if(!['open-md-search','connect-gen2','reconnect-web'].includes(action))return;
 window.parent.postMessage({kind:'living-library-public-card-action',action},window.location.origin);
}));
</script></body></html>
