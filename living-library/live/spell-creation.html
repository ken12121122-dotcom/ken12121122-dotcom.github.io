<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法術卡草稿</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f2e8d7;background:#101a25}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:760px;margin-inline:auto}h1{font:28px Georgia,serif;margin:0 0 8px}p{line-height:1.7;color:#c5c1b9}button,input,textarea,select{font:inherit}button{min-width:48px;min-height:48px;border:1px solid #a88b5e;border-radius:12px;color:#f6dfb3;background:#24313e;font-size:24px;cursor:pointer}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e1b96e;outline-offset:3px}.toolbar{display:flex;gap:10px;align-items:end;margin:20px 0}.toolbar label{flex:1;margin:0}label{display:block;margin:18px 0 6px;color:#ddc49a}input,textarea,select{display:block;width:100%;margin-top:6px;border:1px solid #596674;border-radius:9px;background:#17232f;color:#fff;padding:12px;min-height:48px}textarea{resize:vertical}fieldset{border:0;padding:0;margin:0;min-width:0}aside{border:1px solid #62573e;border-radius:12px;padding:14px;margin:22px 0}aside p{margin:4px 0}#status{min-height:3em;white-space:pre-wrap}#status[data-state=error]{color:#ffb9a8}.note{font-size:14px}footer{display:flex;align-items:center;gap:16px}@media(max-width:420px){body{padding:14px}h1{font-size:25px}}
</style></head><body>
<h1>法術卡草稿</h1><p class="note">保存在這部裝置。尚未接入施法、語音或私人同步。</p>
<div class="toolbar"><label for="savedDrafts">已保存的法術<select id="savedDrafts" disabled><option value="">尚無草稿</option></select></label><button id="newDraft" type="button" aria-label="建立新法術草稿" title="建立新法術草稿" disabled>＋</button><button id="loadDraft" type="button" aria-label="讀取所選草稿" title="讀取所選草稿" disabled>↶</button></div>
<form id="draftForm"><fieldset id="fields" disabled>
<label for="spellName">名稱<input id="spellName" maxlength="128" required></label>
<label for="spellDescription">用途<textarea id="spellDescription" maxlength="4000" rows="3"></textarea></label>
<label for="incantations">咒語與替代說法<textarea id="incantations" rows="3" maxlength="2063" required aria-describedby="phraseHelp"></textarea></label><p id="phraseHelp" class="note">每行一個，最多 16 個；每個最多 128 字。</p>
<aside aria-label="歸書術符文配方"><p>條件：抓著書本 ＋ 咒語命中</p><p>順序：解除抓取 → 返回原書架 → 結果提示</p><p class="note">配方尚未連接遊戲動作。本版可編輯文字，符文拖曳編排後續加入。</p></aside>
<footer><button id="saveDraft" type="submit" aria-label="保存法術草稿到本機" title="保存法術草稿到本機">◇</button><span id="revision" class="note">新草稿</span></footer>
</fieldset></form><p id="status" role="status" aria-live="polite">正在開啟本機資料…</p>
<script src="./action-registry.js"></script><script src="./spell-contract.js"></script><script src="./spell-store.js"></script><script src="./spell-draft.js"></script><script src="./spell-creation.js"></script>
</body></html>
