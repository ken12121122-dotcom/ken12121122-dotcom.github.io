<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>念動世界 × Surface Lab｜隔離整合實驗</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111a;color:#e7e7e3;font:14px system-ui,"Noto Sans TC",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
.toolbar{position:fixed;z-index:5;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.toolbar>*{pointer-events:auto}
button,.upload{cursor:pointer;padding:10px 12px;border:1px solid #6a8c9d;border-radius:9px;color:#e7f5f6;background:rgba(15,35,51,.93)}
button[aria-pressed="true"]{background:#d5b785;color:#16242b;border-color:#ffe2b3}
input[type=file]{display:none}
.note{position:fixed;z-index:5;left:12px;bottom:12px;max-width:min(570px,calc(100vw - 24px));background:rgba(5,17,29,.88);border:1px solid #557582;border-radius:9px;padding:11px 13px;font-size:12px;line-height:1.65}
small{color:#c6e2e4}
#status{color:#fff0d7}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}
</script>
</head>
<body>
<div class="toolbar">
<button id="survival" aria-pressed="false" title="相機/玩家移動預覽；尚無碰撞重力">🌍 生存視角</button>
<button id="creative" aria-pressed="true" title="自由旋轉縮放；尚未嵌入原 Surface Lab 編輯工具">🛠️ 創造視角</button>
<label class="upload">匯入 Surface Lab JSON <input type="file" id="file" accept=".json,application/json"></label>
<button id="reset">合成範例</button>
</div>
<div class="note">
<strong>整合原型／候選分支</strong>　｜　<span id="status">載入中</span><br>
<small>兩種視角共用同一組場景物件。創造視角：滑鼠拖曳旋轉、滾輪縮放。生存視角：WASD 移動測試人物、拖曳旋轉鏡頭。尚未接入正式角色、跳躍、物理碰撞、原始 Surface Lab 編輯器及卡片契約；匯入資料僅在此頁記憶體中預覽，不寫入存檔。無法轉換的面體會明確列出。</small>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {convertSurfaceLabWorld} from './surface-world-adapter.mjs';
const el=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101e2b);
scene.fog=new THREE.Fog(0x101e2b,12,35);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.01,100);
camera.position.set(3,2.6,3.2);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x101e2b);
document.body.insertBefore(renderer.domElement,document.querySelector('.toolbar'));
scene.add(new THREE.HemisphereLight(0xc7eaff,0x25334c,2.2));
const light=new THREE.DirectionalLight(0xffedcf,2.4);light.position.set(-2,7,3);scene.add(light);
const orbit=new OrbitControls(camera,renderer.domElement);
orbit.enableDamping=true;orbit.target.set(0,.4,0);orbit.update();
const grid=new THREE.GridHelper(15,30,0x466579,0x233c4d);scene.add(grid);
const worldGroup=new THREE.Group();scene.add(worldGroup);
const player=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.45,4,8),new THREE.MeshStandardMaterial({color:0xe3c98b,roughness:.8}));
body.position.y=.45;player.add(body);player.visible=false;scene.add(player);
const matByKind={base:0x80a9b4,wall:0x8fa0bd,extrude:0xbfa58d,custom:0x91bfbd};
let mode='creative',yaw=.5,pitch=.35,press=null,loaded=null,last=performance.now();
const held=new Set();
const dir=new THREE.Vector3();
function drawGeometry(data){
  while(worldGroup.children.length){const o=worldGroup.children[0];worldGroup.remove(o);o.geometry?.dispose();o.material?.dispose();}
  const converted=convertSurfaceLabWorld(data);
  for(const obj of converted.objects){
    const poly=obj.polygon;if(poly.length<3)continue;
    const shape=new THREE.Shape();shape.moveTo(poly[0].x,poly[0].y);
    for(const p of poly.slice(1))shape.lineTo(p.x,p.y);
    shape.closePath();
    const geo=new THREE.ExtrudeGeometry(shape,{depth:Math.abs(obj.depth),bevelEnabled:false,steps:1,curveSegments:1});
    const material=new THREE.MeshStandardMaterial({color:matByKind[obj.kind]||0x82adae,side:THREE.DoubleSide,roughness:.76,transparent:true,opacity:.94});
    const mesh=new THREE.Mesh(geo,material);mesh.name=obj.name;mesh.userData.sourceId=obj.sourceId;
    const u=obj.basis.u,v=obj.basis.v,n=obj.basis.n;
    const matrix=new THREE.Matrix4().makeBasis(new THREE.Vector3(u.x,u.y,u.z),new THREE.Vector3(v.x,v.y,v.z),new THREE.Vector3(n.x,n.y,n.z));
    mesh.quaternion.setFromRotationMatrix(matrix);
    mesh.position.set(obj.origin.x,obj.origin.y,obj.origin.z);
    mesh.scale.z=obj.depth<0?-1:1;
    worldGroup.add(mesh);
  }
  const descriptions=converted.gaps.map(g=>(g.surfaceId||'(無 ID)')+':'+g.reason);
  el('status').textContent=converted.objects.length+' 個面體已匯入，'+converted.gaps.length+' 個待支援'+(descriptions.length?'｜'+descriptions.join(', '):'');
  loaded=converted;
}
async function sample(){
  try{const r=await fetch('./synthetic-demo.json',{cache:'no-store'});if(!r.ok)throw Error('範例 HTTP '+r.status);drawGeometry(await r.json());}
  catch(e){el('status').textContent=e.message;}
}
async function upload(ev){
  const file=ev.target.files?.[0];if(!file)return;
  try{const data=JSON.parse(await file.text());drawGeometry(data);}
  catch(e){el('status').textContent='匯入失敗：'+e.message;}
  ev.target.value='';
}
function setMode(next){
  if(next===mode)return;mode=next;
  player.visible=mode==='survival';grid.visible=mode==='creative';orbit.enabled=mode==='creative';
  for(const x of ['survival','creative'])el(x).setAttribute('aria-pressed',String(mode===x));
  if(mode==='survival'){
    player.position.set(0,0,0);camera.position.set(1.7,1.35,1.7);
  }else{
    orbit.target.copy(player.position).add(new THREE.Vector3(0,.4,0));
    camera.position.copy(player.position).add(new THREE.Vector3(2,2,2));
    orbit.update();
  }
  held.clear();
}
el('file').addEventListener('change',upload);
el('reset').addEventListener('click',sample);
for(const x of ['survival','creative'])el(x).addEventListener('click',()=>setMode(x));
window.addEventListener('keydown',e=>{if(!/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||''))held.add(e.key.toLowerCase());});
window.addEventListener('keyup',e=>held.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>held.clear());
renderer.domElement.addEventListener('pointerdown',e=>{if(mode==='survival')press={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointermove',e=>{
  if(mode!=='survival'||!press||!(e.buttons&1))return;
  yaw+=(e.clientX-press.x)*.005;pitch=THREE.MathUtils.clamp(pitch+(e.clientY-press.y)*.004,-.2,1.1);
  press={x:e.clientX,y:e.clientY};
});
renderer.domElement.addEventListener('pointerup',()=>press=null);
renderer.domElement.addEventListener('pointercancel',()=>press=null);
window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.06,(now-last)/1000);last=now;
  if(mode==='creative')orbit.update();
  else{
    dir.set((held.has('d')?1:0)-(held.has('a')?1:0),0,(held.has('s')?1:0)-(held.has('w')?1:0));
    if(dir.lengthSq())player.position.addScaledVector(dir.normalize(),dt*.8);
    const radius=2.2;
    camera.position.copy(player.position).add(new THREE.Vector3(Math.sin(yaw)*radius,1.1+Math.sin(pitch)*radius,Math.cos(yaw)*radius));
    camera.lookAt(player.position.x,player.position.y+.55,player.position.z);
  }
  renderer.render(scene,camera);
}
sample();requestAnimationFrame(frame);
</script>
</body></html>
