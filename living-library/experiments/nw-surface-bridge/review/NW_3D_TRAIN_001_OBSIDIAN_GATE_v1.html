<script type="module">
'use strict';
const viewport=document.getElementById('viewport');
const status=document.getElementById('stateText');
const loading=document.getElementById('loading');
function fail(error){
 console.error('[NW-3D-TRAIN-001]',error);

async function loadThree(){
 for(const url of [
  'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js',
  'https://unpkg.com/three@0.185.0/build/three.module.js'
 ]){
  try{return await import(url)}catch(error){console.warn('Three source unavailable:',url,error)}
 }
 throw new Error('Cannot import pinned Three.js');
}
try{
 const THREE=await loadThree();
 const scene=new THREE.Scene();
 scene.background=new THREE.Color('#090d18');
 scene.fog=new THREE.FogExp2('#090d18',.026);
 const camera=new THREE.PerspectiveCamera(40,1,.1,120);
 const renderer=new THREE.WebGLRenderer({antialias:innerWidth>720,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,innerWidth<640?1.5:2));

 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.48;
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 viewport.appendChild(renderer.domElement);
 const ambient=new THREE.HemisphereLight('#97aecf','#10101b',2.0);scene.add(ambient);
 const key=new THREE.DirectionalLight('#e3d6c0',4.2);
 key.position.set(5,9,8);key.castShadow=true;
 key.shadow.mapSize.set(1024,1024);
 key.shadow.camera.left=-10;key.shadow.camera.right=10;key.shadow.camera.top=10;key.shadow.camera.bottom=-10;
 key.shadow.bias=-.0005;scene.add(key);
 const violet=new THREE.PointLight('#7655e9',55,15,1.9);
 violet.position.set(-4,4,-2);scene.add(violet);
 const ice=new THREE.PointLight('#4abbe8',52,16,1.9);
 ice.position.set(4.5,4,4);scene.add(ice);
 const rim=new THREE.DirectionalLight('#a0d9ff',2.25);
 rim.position.set(-5,3,-5);scene.add(rim);
 // Deterministic high-frequency stone albedo/bump texture. No external model or paid asset.
 let seed=153937;
 function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
 function stoneTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;
  const cx=c.getContext('2d',{willReadFrequently:true});
  const im=cx.createImageData(256,256);
  const n=new Float32Array(256*256);
  for(let i=0;i<n.length;i++)n[i]=rand();
  for(let y=0;y<256;y++)for(let x=0;x<256;x++){
   const i=y*256+x,v=Math.max(0,Math.min(255,17+n[i]*17+Math.sin(x*.17+y*.09)*5));
   im.data[i*4]=v*.83;im.data[i*4+1]=v*.88;im.data[i*4+2]=v*1.25;im.data[i*4+3]=255;
  }
  cx.putImageData(im,0,0);
  for(let i=0;i<24;i++){
   cx.beginPath();const x=rand()*256,y=rand()*256;
   cx.moveTo(x,y);
   cx.bezierCurveTo(x+8,y-16,x-22,y+23,x+20,y+rand()*45);
   cx.strokeStyle=rand()>.5?'rgba(91,116,176,.19)':'rgba(2,4,12,.58)';
   cx.lineWidth=.5+rand()*1.2;cx.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2.4,2.4);
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=Math.min(4,renderer.capabilities.getMaxAnisotropy());
  return t;
 }
 const stoneMap=stoneTexture();
 const mat={
  obsidian:new THREE.MeshStandardMaterial({map:stoneMap,bumpMap:stoneMap,bumpScale:.038,color:'#b4bed8',roughness:.29,metalness:.31,side:THREE.DoubleSide}),
  inset:new THREE.MeshStandardMaterial({color:'#101223',roughness:.52,metalness:.25,side:THREE.DoubleSide}),
  edge:new THREE.MeshStandardMaterial({color:'#353a53',roughness:.39,metalness:.45,side:THREE.DoubleSide}),
  pitch:new THREE.MeshStandardMaterial({color:'#080a12',roughness:.32,metalness:.24}),
  bronze:new THREE.MeshStandardMaterial({color:'#9a7140',roughness:.29,metalness:.88,side:THREE.DoubleSide}),
  brass:new THREE.MeshStandardMaterial({color:'#c8a36c',roughness:.26,metalness:.88}),
  rune:new THREE.MeshStandardMaterial({color:'#6fc6e7',emissive:'#149dc9',emissiveIntensity:2.15,roughness:.33}),
  amber:new THREE.MeshStandardMaterial({color:'#e8bd78',emissive:'#af6e21',emissiveIntensity:.44,metalness:.63,roughness:.25}),
  gem:new THREE.MeshPhysicalMaterial({color:'#6a4be1',emissive:'#5531b5',emissiveIntensity:1.4,metalness:.27,roughness:.15,clearcoat:1,clearcoatRoughness:.08}),
  platform:new THREE.MeshStandardMaterial({color:'#242536',metalness:.21,roughness:.66}),
  sapphire:new THREE.MeshPhysicalMaterial({color:'#84dfff',emissive:'#155bd0',emissiveIntensity:1.95,metalness:.12,roughness:.11,clearcoat:1,clearcoatRoughness:.03}),
  obsidianPolish:new THREE.MeshPhysicalMaterial({color:'#292d44',roughness:.19,metalness:.66,clearcoat:.85,clearcoatRoughness:.08}),
  cyanFire:new THREE.MeshBasicMaterial({color:'#79f0ff',toneMapped:false,side:THREE.DoubleSide}),
  violetFire:new THREE.MeshBasicMaterial({color:'#bd7dff',toneMapped:false,side:THREE.DoubleSide}),
  cyanHalo:new THREE.MeshBasicMaterial({color:'#41bfff',toneMapped:false,transparent:true,opacity:.20,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}),
  violetHalo:new THREE.MeshBasicMaterial({color:'#894afa',toneMapped:false,transparent:true,opacity:.24,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide})
 };
 const gate=new THREE.Group();gate.name='NW-3D-TRAIN-001_Obsidian_Frame';scene.add(gate);
 const parts={};
 for(const id of ['G01','G02','G03','G04','G05','G06']){
  parts[id]=new THREE.Group();parts[id].name=id;gate.add(parts[id]);
 }
 const attach=(id,mesh)=>{parts[id].add(mesh);mesh.castShadow=true;mesh.receiveShadow=true;return mesh};
 const box=(id,x,y,z,sx,sy,sz,material)=>{
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
  mesh.position.set(x,y,z);return attach(id,mesh);
 };
 function cyl(id,x,y,z,r1,r2,h,material,edges=10){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,edges),material);
  m.position.set(x,y,z);return attach(id,m);
 }
 function torus(id,x,y,z,r,t,material,rotation=0){
  const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,8,72),material);
  m.position.set(x,y,z);m.rotation.y=rotation;return attach(id,m);
 }
 function spike(id,x,y,z,height,radius,material,up=true){
  const m=new THREE.Mesh(new THREE.ConeGeometry(radius,height,5),material);
  m.position.set(x,y,z);if(!up)m.rotation.z=Math.PI;return attach(id,m);
 }
 // Gothic pointed arch described by two quadratic Bezier curves (one cusp at the apex).
 function archPoints(half,shoulder,apex,segments=22){
  const left=[];
  for(let i=0;i<=segments;i++){
   const t=i/segments,u=1-t;
   left.push(new THREE.Vector2(u*u*(-half)+2*u*t*(-half*.83),u*u*shoulder+2*u*t*(apex-.31)+t*t*apex));
  }
  const right=left.slice(0,-1).reverse().map(p=>new THREE.Vector2(-p.x,p.y));
  return [...left,...right];
 }
 function band(id,outer,inner,z,depth,material){
  const outerPts=archPoints(...outer),innerPts=archPoints(...inner).reverse();
  const shape=new THREE.Shape();
  shape.moveTo(outerPts[0].x,outerPts[0].y);
  for(const p of outerPts.slice(1))shape.lineTo(p.x,p.y);
  for(const p of innerPts)shape.lineTo(p.x,p.y);
  shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{depth,steps:1,bevelEnabled:true,bevelThickness:.028,bevelSize:.023,bevelSegments:2});
  geo.computeVertexNormals();
  const m=new THREE.Mesh(geo,material);m.position.z=z;
  return attach(id,m);
 }
 function beam(id,a,b,width,depth,material,z){
  const dx=b.x-a.x,dy=b.y-a.y;
  const m=box(id,(a.x+b.x)/2,(a.y+b.y)/2,z,width,Math.hypot(dx,dy),depth,material);
  m.rotation.z=-Math.atan2(dx,dy);return m;
 }
 function stud(id,x,y,z,r,material){
  const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),material);
  m.position.set(x,y,z);return attach(id,m);
 }
 // CARVING TOOLKIT (v1.1). Everything belongs to one of the same six canonical part IDs.
 // Reusable beveled gemstone-like rectangular bas-relief, centered at an explicit 3D coordinate.
 function plaque(id,x,y,z,w,h,d,material,cut=.16){
  const a=Math.min(w,h)*cut;
  const pts=[[-w/2+a,-h/2],[w/2-a,-h/2],[w/2,-h/2+a],[w/2,h/2-a],
             [w/2-a,h/2],[-w/2+a,h/2],[-w/2,h/2-a],[-w/2,-h/2+a]];
  const shape=new THREE.Shape();
  shape.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)shape.lineTo(...pts[i]);
  shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:.012,bevelSize:.012,bevelSegments:1,steps:1});
  const mesh=attach(id,new THREE.Mesh(geo,material));
  mesh.position.set(x,y,z);return mesh;
 }
 // Incised angular language: five different runes, assembled as fine physical relief strokes.
 const runeGlyphs=[
  [[-.34,-.46,0,.44],[0,.44,.34,-.46],[-.20,-.20,.20,-.20]],
  [[-.30,.42,.28,.42],[0,.42,0,-.44],[-.30,-.44,.30,-.44]],
  [[-.33,-.36,.33,.36],[-.33,.36,.33,-.36],[-.30,0,.30,0]],
  [[-.32,-.41,-.32,.39],[-.32,.39,.32,0],[.32,0,-.32,-.41]],
  [[-.30,.40,.30,.40],[.30,.40,.30,-.42],[-.30,-.42,.30,-.42],[-.30,.40,0,-.42]]
 ];
 function runeRelief(id,x,y,z,scale,index,material){
  const strokes=runeGlyphs[index%runeGlyphs.length];
  for(const [x1,y1,x2,y2] of strokes){
   const a=new THREE.Vector2(x+x1*scale,y+y1*scale),b=new THREE.Vector2(x+x2*scale,y+y2*scale);
   const mesh=beam(id,a,b,Math.max(.011,scale*.07),.024,material,z);
   mesh.castShadow=false;mesh.receiveShadow=false;
  }
 }
 function raisedRivet(id,x,y,z,r=.032,material=mat.brass){
  const n=stud(id,x,y,z,r,material);n.castShadow=false;n.receiveShadow=false;return n;
 }
 function stoneFacet(id,x,y,z,w,h,material){
  // Inclined chiselled wedge panels read as real silhouettes from the side, not a flat decal.
  const mesh=plaque(id,x,y,z,w,h,.07,material,.27);
  mesh.rotation.z=(x>0?-1:1)*.025;
  return mesh;
 }
 // G01 – 12-tapered faces, five structural segments and deep stone ribs per pillar.
 for(const s of [-1,1]){
  const x=s*1.75;
  box('G01',x,2.02,0,.72,3.87,.9,mat.obsidian);
  box('G01',x,2.00,-.45,.91,3.94,.14,mat.inset);
  box('G01',x,2.02,.44,.55,3.78,.14,mat.edge);
  for(const y of [.48,1.28,2.10,2.94,3.62]){
   box('G01',x,y,.05,.94,.14,1.06,mat.obsidian);
   box('G01',x,y+.045,.59,1,.055,.12,mat.edge);
  }
  box('G01',x+s*.34,1.95,.05,.14,3.72,.95,mat.pitch);
  box('G01',x-s*.23,2.03,.52,.14,3.7,.09,mat.inset);
  for(const y of [1.02,1.86,2.70,3.36]){
   const p=box('G01',x, y,.58,.38,.54,.11,mat.obsidian);
   p.rotation.z=s*.075;
  }
  spike('G01',x,4.24,-.02,.95,.30,mat.obsidian);
  spike('G01',x+s*.26,4.35,-.18,.53,.13,mat.edge);
 }
 // G01 v1.1 — stacked chiseled armor, chamfered pilasters, side reinforcements,
 // fluted basalt veins and fine rivets on BOTH visible faces.
 for(const s of [-1,1]){
  const x=s*1.75;
  for(const y of [.89,1.71,2.54,3.32]){
   plaque('G01',x,y,.675,.56,.56,.13,mat.obsidian,.25);
   stoneFacet('G01',x,y,.825,.30,.39,mat.edge);
   stoneFacet('G01',x,y,-.57,.53,.53,mat.obsidian);
   plaque('G01',x,y,-.70,.29,.31,.025,mat.pitch,.3);
  }
  for(const off of [-.27,.27]){
   for(const z of [.63,-.59]){
    const fluted=box('G01',x+off,2.07,z,.056,3.51,.065,mat.edge);
    fluted.castShadow=false;
    for(const y of [.85,1.62,2.37,3.21]){
     stoneFacet('G01',x+off,y,z+.04,.115,.26,mat.obsidian);

  }
  for(const y of [.88,1.7,2.54,3.32]){
   for(const off of [-.39,.39]){
    plaque('G01',x+off,y,.25,.11,.45,.19,mat.obsidian,.3);

  }

   const toe=spike('G01',x+i*.20,.86,-.31,.69,.15,mat.edge,false);

 }
 // G02 – pointed, layered architectural masonry, no filled portal plane.
 band('G02',[2.12,3.62,5.72],[1.34,3.61,4.72],-.40,.87,mat.obsidian);
 band('G02',[2.22,3.78,5.94],[2.07,3.68,5.74],-.15,.34,mat.inset);
 band('G02',[2.15,3.69,5.84],[2.01,3.61,5.65],.45,.15,mat.edge);
 band('G02',[1.55,3.68,5.07],[1.39,3.64,4.86],.48,.19,mat.pitch);

 const halo=new THREE.Mesh(new THREE.RingGeometry(2.25,2.31,96),new THREE.MeshBasicMaterial({color:'#4b7087',transparent:true,opacity:.45,side:THREE.DoubleSide}));
 halo.rotation.x=-Math.PI/2;halo.position.y=.026;scene.add(halo);
 // Camera controls use Pointer Events: touch rotate, pinch zoom/pan, Shift+drag pan, wheel zoom.
 const focus=new THREE.Vector3(0,3.05,0);
 const cameraState={yaw:.13,pitch:.035,distance:13.6};
 let last=0,framePending=false;
 const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
 function updateCamera(){
  const s=cameraState;
  camera.position.set(focus.x+Math.sin(s.yaw)*Math.cos(s.pitch)*s.distance,
   focus.y+Math.sin(s.pitch)*s.distance,
   focus.z+Math.cos(s.yaw)*Math.cos(s.pitch)*s.distance);
  camera.lookAt(focus);
  invalidate();
 }
 function setView(yaw,pitch,distance){
  cameraState.yaw=yaw;cameraState.pitch=pitch;cameraState.distance=distance;focus.set(0,3.05,0);
  updateCamera();
 }
 const pointers=new Map();let pinch=null,dragged=false,spin=false;
 function pointerArray(){return [...pointers.values()]}
 viewport.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.button!==1&&e.button!==2)return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,prevX:e.clientX,prevY:e.clientY,shift:e.shiftKey||e.button!==0});
  if(pointers.size===2){const [a,b]=pointerArray();pinch={distance:Math.hypot(a.x-b.x,a.y-b.y),midX:(a.x+b.x)/2,midY:(a.y+b.y)/2}}
  else pinch=null;
  viewport.setPointerCapture(e.pointerId);dragged=true;e.preventDefault();
 });
 viewport.addEventListener('pointermove',e=>{
  const p=pointers.get(e.pointerId);if(!p)return;
  p.prevX=p.x;p.prevY=p.y;p.x=e.clientX;p.y=e.clientY;
  const w=Math.max(1,viewport.clientWidth),h=Math.max(1,viewport.clientHeight);
  if(pointers.size===2){
   const [a,b]=pointerArray(),d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
   if(pinch){
    cameraState.distance=clamp(cameraState.distance*pinch.distance/Math.max(8,d),6.2,20);
    focus.x=clamp(focus.x+(pinch.midX-mx)*cameraState.distance/w*.9,-2.5,2.5);
    focus.y=clamp(focus.y+(my-pinch.midY)*cameraState.distance/h*.7,1,5.2);
   }
   pinch={distance:d,midX:mx,midY:my};
  }else if(p.shift){
   focus.x=clamp(focus.x-(p.x-p.prevX)*cameraState.distance/w,-2.5,2.5);
   focus.y=clamp(focus.y+(p.y-p.prevY)*cameraState.distance/h,1,5.2);
  }else{
   cameraState.yaw-=(p.x-p.prevX)*.008;
   cameraState.pitch=clamp(cameraState.pitch+(p.y-p.prevY)*.006,-.35,1.3);
  }
  updateCamera();e.preventDefault();
 });
 function endPointer(e){pointers.delete(e.pointerId);if(pointers.size<2)pinch=null}
 viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
 viewport.addEventListener('wheel',e=>{
  cameraState.distance=clamp(cameraState.distance*Math.exp(e.deltaY*.001),6.2,20);updateCamera();e.preventDefault();
 },{passive:false});
 viewport.addEventListener('contextmenu',e=>e.preventDefault());
 viewport.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')cameraState.yaw-=.11;
  else if(e.key==='ArrowRight')cameraState.yaw+=.11;
  else if(e.key==='ArrowUp')cameraState.pitch=clamp(cameraState.pitch+.08,-.35,1.3);
  else if(e.key==='ArrowDown')cameraState.pitch=clamp(cameraState.pitch-.08,-.35,1.3);
  else if(e.key==='+'||e.key==='=')cameraState.distance=clamp(cameraState.distance-.7,6.2,20);
  else if(e.key==='-')cameraState.distance=clamp(cameraState.distance+.7,6.2,20);
  else return;
  updateCamera();e.preventDefault();
 });
 document.getElementById('front').addEventListener('click',()=>{spin=false;syncSpin();setView(0,.02,13.5)});
 document.getElementById('side').addEventListener('click',()=>{spin=false;syncSpin();setView(Math.PI/2,.04,13.5)});
 document.getElementById('reset').addEventListener('click',()=>{spin=false;syncSpin();setView(.13,.035,13.6)});
 const spinButton=document.getElementById('spin');
 const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
 function syncSpin(){
  spinButton.setAttribute('aria-pressed',String(spin));spinButton.title=spin?'停止旋轉':'自動旋轉';
  spinButton.setAttribute('aria-label',spinButton.title);
 }
 spinButton.addEventListener('click',()=>{spin=!spin;syncSpin();invalidate()});
 document.querySelectorAll('.mod').forEach(row=>{
  const part=parts[row.dataset.part],button=row.querySelector('button'),label=row.querySelector('span').textContent;
  button.addEventListener('click',()=>{
   part.visible=!part.visible;
   button.setAttribute('aria-pressed',String(!part.visible));
   button.textContent=part.visible?'◉':'◌';
   button.setAttribute('aria-label',part.visible?'隱藏 '+row.dataset.part+' '+label:'顯示 '+row.dataset.part+' '+label);
   invalidate();
  });
 });
 function resize(){
  const w=Math.max(1,viewport.clientWidth),h=Math.max(1,viewport.clientHeight);
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  if(w<650)cameraState.distance=Math.max(cameraState.distance,15.4);
  updateCamera();
 }
 window.addEventListener('resize',resize);resize();
 status.textContent='神殿精雕 v1.2 · 雙側機械圓環與雕刻';loading.hidden=true;
 // Render only when the viewer interacts. Auto-rotation opts into a continuous loop.
 // This avoids a 60fps shadowed scene while the phone is idle.
 function invalidate(){
  if(!framePending&&!document.hidden){framePending=true;requestAnimationFrame(render)}
 }
 function render(now){
  framePending=false;
  if(document.hidden)return;
  const dt=last?Math.min((now-last)/1000,.07):0;last=now;
  if(spin&&pointers.size===0){
   cameraState.yaw+=dt*.28;
   // Don't recurse through updateCamera here; compute the orbit for this frame.
   const s=cameraState;
   camera.position.set(focus.x+Math.sin(s.yaw)*Math.cos(s.pitch)*s.distance,
    focus.y+Math.sin(s.pitch)*s.distance,focus.z+Math.cos(s.yaw)*Math.cos(s.pitch)*s.distance);
   camera.lookAt(focus);
  }
  renderer.render(scene,camera);
  if(spin)invalidate();
 }
 document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){last=0;invalidate()}
 });
 invalidate();

 window.NW3DReview=Object.freeze({
  id:'NW-3D-TRAIN-001',stage:'candidate',version:'v1.2',
  modules:Object.freeze(Object.keys(parts)),
  visualOnly:true,
  details:Object.freeze(['beveled obsidian armor','backside engraving','nested gothic keystones','five-glyph relief alphabet','bronze filigree','sixteen-point celestial astrolabe','rivet and stepped plinth','twin suspended gemstone compasses','three three-dimensional orbital rings','flying buttresses and slender gothic spires','illuminated inner-arch seams']),
  dimensions:Object.freeze({approxHeight:7.21,approxWidth:6.4,clearOpeningWidth:2.68}),
  parts:Object.freeze(Object.fromEntries(Object.keys(parts).map(k=>[k,parts[k].name])))
 });
