name: Build PackageCanvas Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-packagecanvas/**'
      - '.github/workflows/build-packagecanvas-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p android-packagecanvas assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-packagecanvas/app/build/outputs/apk/debug/app-debug.apk PackageCanvas-v0.6a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PackageCanvas-Android-APK
          path: PackageCanvas-v0.6a.apk
          if-no-files-found: error
