name: FOX App CI

on:
  push:
    branches:
      - main
    paths:
      - 'fox-app/**'
      - '.github/workflows/fox-app-ci.yml'
  pull_request:
    paths:
      - 'fox-app/**'
      - '.github/workflows/fox-app-ci.yml'

permissions:
  contents: write

concurrency:
  group: fox-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build FOX app (debug)
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p fox-app \
            :app:testDebugUnitTest \
            :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fox-app-debug
          path: fox-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Actions artifacts (the step above) live on Azure Blob Storage, which
      # isn't reachable from every environment that needs this APK. Also
      # publish it as a GitHub Release asset (served from a github.com/
      # objects.githubusercontent.com domain instead) so it's downloadable
      # from anywhere that can reach the GitHub API.
      - name: Publish debug APK as a GitHub Release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release delete fox-app-latest-debug --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create fox-app-latest-debug \
            fox-app/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "FOX App debug APK (latest)" \
            --notes "Auto-published from commit ${{ github.sha }} by fox-app-ci.yml. Debug build only — unsigned for release, do not distribute beyond testing."
