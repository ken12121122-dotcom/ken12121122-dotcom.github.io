name: FOX App CI

on:
  push:
    branches:
      - main
    paths:
      - 'fox-app/**'
      - '.github/workflows/fox-app-ci.yml'
  pull_request:
    paths:
      - 'fox-app/**'
      - '.github/workflows/fox-app-ci.yml'

permissions:
  contents: read

concurrency:
  group: fox-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build FOX app (debug)
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p fox-app \
            :app:testDebugUnitTest \
            :app:assembleDebug
