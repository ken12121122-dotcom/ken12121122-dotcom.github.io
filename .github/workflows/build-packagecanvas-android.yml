name: Build PackageCanvas Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/packagecanvas/**"
      - ".github/workflows/build-packagecanvas-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/packagecanvas
    steps:
      - name: Checkout Android project only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android/packagecanvas
          sparse-checkout-cone-mode: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PackageCanvas-Android-debug
          path: android/packagecanvas/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
