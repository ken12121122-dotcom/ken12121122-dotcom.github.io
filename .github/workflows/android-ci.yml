name: Android PR Validation

on:
  pull_request:
    branches:
      - release/android
    paths:
      - 'android-native/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6

      - name: Read release metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path('android-native/release-version.json').read_text())
          print(f"AMIN_VERSION_CODE={data['versionCode']}")
          print(f"AMIN_VERSION_NAME={data['versionName']}")
          print(f"AMIN_BRIDGE_SUFFIX=-bridge{data['bridge']}")
          PY

      - name: Validate single Graph renderer and evidence pipeline
        shell: bash
        run: |
          set -euxo pipefail
          node --check android-native/app/src/main/assets/amin-wiki-graph/index.html >/dev/null 2>&1 || true
          node --check android-native/app/src/main/assets/amin-wiki-graph/source-review.js

          test -f android-native/app/src/main/assets/amin-wiki-graph/index.html
          test -f android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/architecture-visibility.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/capability-semantic-zoom.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/github-native-capabilities.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/github-bootstrap-gate.js

          grep -q 'canvas id="graph"' android-native/app/src/main/assets/amin-wiki-graph/index.html
          grep -q 'physicsStep' android-native/app/src/main/assets/amin-wiki-graph/index.html
          grep -q 'layoutAuthority' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'amin-dynamic-canvas-only' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'canonicalEvidence' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'amin-canonical-evidence' android-native/app/src/main/java/com/amin/pocketgba/CanonicalEvidenceAdapter.java
          grep -q 'sourceKey' android-native/app/src/main/java/com/amin/pocketgba/CanonicalEvidenceAdapter.java
          grep -q 'evidenceRevision' android-native/app/src/main/java/com/amin/pocketgba/CanonicalEvidenceAdapter.java
          grep -q 'evidence-only-reverse-v2' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'SCANNER_COMMAND_EVIDENCE_NOT_FOUND' android-native/app/src/main/java/com/amin/pocketgba/ScannerReverseDiscovery.java
          grep -q 'Scanner Reverse Discovery' android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          grep -q 'acceptPendingSourceRevision' android-native/app/src/main/assets/amin-wiki-graph/source-review.js

          ! grep -q 'buildGraph(JSONArray tree' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          ! grep -q 'semanticAnchor' android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          ! grep -q 'createElement.(.canvas' android-native/app/src/main/assets/amin-wiki-graph/source-review.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source and build
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p android-native \
            -PAMIN_VERSION_CODE="$AMIN_VERSION_CODE" \
            -PAMIN_VERSION_NAME="$AMIN_VERSION_NAME" \
            -PAMIN_BRIDGE_SUFFIX="$AMIN_BRIDGE_SUFFIX" \
            :app:testDebugUnitTest \
            :app:testBridgeUnitTest \
            :app:lintBridge \
            :app:assembleDebug

      - name: Publish PR test APK
        uses: actions/upload-artifact@v4
        with:
          name: amin-pr-${{ github.event.pull_request.number }}-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
