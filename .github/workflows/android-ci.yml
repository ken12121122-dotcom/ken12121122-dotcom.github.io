name: Android PR Validation

on:
  pull_request:
    branches:
      - release/android
    paths:
      - 'android-native/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6

      - name: Read release metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path('android-native/release-version.json').read_text())
          print(f"AMIN_VERSION_CODE={data['versionCode']}")
          print(f"AMIN_VERSION_NAME={data['versionName']}")
          print(f"AMIN_BRIDGE_SUFFIX=-bridge{data['bridge']}")
          PY

      - name: Validate Graph architecture JavaScript
        shell: bash
        run: |
          set -euxo pipefail
          node --check android-native/app/src/main/assets/amin-wiki-graph/architecture-visibility.js
          node --check android-native/app/src/main/assets/amin-wiki-graph/capability-semantic-zoom.js
          node --check android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          node --check android-native/app/src/main/assets/amin-wiki-graph/github-native-capabilities.js
          node --check android-native/app/src/main/assets/amin-wiki-graph/github-bootstrap-gate.js
          grep -q "AminGraphArchitectureVisibility" android-native/app/src/main/assets/amin-wiki-graph/architecture-visibility.js
          grep -q "architectureFindings" android-native/app/src/main/assets/amin-wiki-graph/architecture-visibility.js
          grep -q "capabilitySource" android-native/app/src/main/assets/amin-wiki-graph/architecture-visibility.js
          grep -q "AminCapabilitySemanticZoom" android-native/app/src/main/assets/amin-wiki-graph/capability-semantic-zoom.js
          grep -q "遠景｜只顯示大節點" android-native/app/src/main/assets/amin-wiki-graph/capability-semantic-zoom.js
          grep -q "中景｜大＋中節點" android-native/app/src/main/assets/amin-wiki-graph/capability-semantic-zoom.js
          grep -q "近景｜大＋中＋小節點" android-native/app/src/main/assets/amin-wiki-graph/capability-semantic-zoom.js
          grep -q "待確認 Source 更新" android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          grep -q "確認變更" android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          grep -q "AminSourceReviewRefresh" android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          grep -q "AminGitHubNativeCapabilityMap" android-native/app/src/main/assets/amin-wiki-graph/github-native-capabilities.js
          grep -q "readOnly:true" android-native/app/src/main/assets/amin-wiki-graph/github-native-capabilities.js
          grep -q "AminGitHubBootstrapGate" android-native/app/src/main/assets/amin-wiki-graph/github-bootstrap-gate.js
          grep -q "正在建立 GitHub 架構" android-native/app/src/main/assets/amin-wiki-graph/github-bootstrap-gate.js
          grep -q "手機現有功能" android-native/app/src/main/assets/amin-wiki-graph/github-bootstrap-gate.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source and build
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p android-native \
            -PAMIN_VERSION_CODE="$AMIN_VERSION_CODE" \
            -PAMIN_VERSION_NAME="$AMIN_VERSION_NAME" \
            -PAMIN_BRIDGE_SUFFIX="$AMIN_BRIDGE_SUFFIX" \
            :app:testDebugUnitTest \
            :app:testBridgeUnitTest \
            :app:lintBridge \
            :app:assembleDebug

      - name: Publish PR test APK
        uses: actions/upload-artifact@v4
        with:
          name: amin-pr-${{ github.event.pull_request.number }}-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
