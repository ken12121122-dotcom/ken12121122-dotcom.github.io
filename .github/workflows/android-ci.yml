name: Android PR Validation

on:
  pull_request:
    branches:
      - release/android
      - feat/github-control-layer-phase1-readonly
      - feat/step11-capability-runtime-contract
      - feat/focus-chain-navigation-phase1
    paths:
      - 'android-native/**'
      - 'tools/tree-sitter-scanner/**'
      - '.github/workflows/android-ci.yml'

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AMIN_SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read release metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path('android-native/release-version.json').read_text())
          print(f"AMIN_VERSION_CODE={data['versionCode']}")
          print(f"AMIN_VERSION_NAME={data['versionName']}")
          print(f"AMIN_BRIDGE_SUFFIX=-bridge{data['bridge']}")
          PY

      - name: Validate single Graph renderer and evidence pipeline
        shell: bash
        run: |
          set -euxo pipefail
          node --check android-native/app/src/main/assets/amin-wiki-graph/index.html >/dev/null 2>&1 || true
          node --check android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          node --check android-native/app/src/main/assets/amin-wiki-graph/focus-chain-projection.js
          node --test tests/*.test.mjs

          test -f android-native/app/src/main/assets/amin-wiki-graph/index.html
          test -f android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          test -f android-native/app/src/main/assets/amin-wiki-graph/focus-chain-projection.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/architecture-visibility.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/capability-semantic-zoom.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/github-native-capabilities.js
          test ! -f android-native/app/src/main/assets/amin-wiki-graph/github-bootstrap-gate.js

          grep -q 'canvas id="graph"' android-native/app/src/main/assets/amin-wiki-graph/index.html
          grep -q 'physicsStep' android-native/app/src/main/assets/amin-wiki-graph/index.html
          grep -q 'layoutAuthority' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'amin-dynamic-canvas-only' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'syncedEvidence' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'GraphEvidenceSyncStore' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'CapabilityInventoryStore' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'CapabilityInventoryProjector.append' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'SharedGraphSyncKernel.apply' android-native/app/src/main/java/com/amin/pocketgba/CapabilityInventoryStore.java
          grep -q 'put("execution_enabled", false)' android-native/app/src/main/java/com/amin/pocketgba/CapabilityGraphContract.java
          grep -q 'CERTIFICATION_SCOPE_REQUIRED' android-native/app/src/main/java/com/amin/pocketgba/CapabilityGraphContract.java
          grep -q 'CAPABILITY 治理 · 唯讀' android-native/app/src/main/assets/amin-wiki-graph/index.html
          grep -q 'NodeRegistry.registryJson' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'VoiceCommandCatalog.getCommands' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'NodeRegistry.typedEdgesJson' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'GitHubWorkSyncStore' android-native/app/src/main/java/com/amin/pocketgba/UnifiedGraphProvider.java
          grep -q 'SharedGraphSyncKernel.apply' android-native/app/src/main/java/com/amin/pocketgba/GitHubWorkSyncStore.java
          grep -q 'amin-canonical-evidence' android-native/app/src/main/java/com/amin/pocketgba/CanonicalEvidenceAdapter.java
          grep -q 'CanonicalEvidenceBatchMerger' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'BundledIndexerEvidenceProvider' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'scanner-evidence/tree-sitter-scanner.json' android-native/app/src/main/java/com/amin/pocketgba/BundledIndexerEvidenceProvider.java
          grep -q 'Stable entityId/relationId identity' android-native/app/src/main/java/com/amin/pocketgba/CanonicalEvidenceBatchMerger.java
          grep -q 'amin-indexer-evidence' android-native/app/src/main/java/com/amin/pocketgba/IndexerEvidenceAdapter.java
          grep -q 'sourceKey' android-native/app/src/main/java/com/amin/pocketgba/CanonicalEvidenceAdapter.java
          grep -q 'evidenceRevision' android-native/app/src/main/java/com/amin/pocketgba/CanonicalEvidenceAdapter.java
          grep -q 'amin-synced-graph-evidence' android-native/app/src/main/java/com/amin/pocketgba/GraphSyncEngine.java
          grep -q 'firstSeen' android-native/app/src/main/java/com/amin/pocketgba/GraphSyncEngine.java
          grep -q 'lastSeen' android-native/app/src/main/java/com/amin/pocketgba/GraphSyncEngine.java
          grep -q 'sourceHash' android-native/app/src/main/java/com/amin/pocketgba/GraphSyncEngine.java
          grep -q '"stale"' android-native/app/src/main/java/com/amin/pocketgba/GraphSyncEngine.java
          grep -q 'GraphEvidenceSyncStore' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'GraphGrowthPlaybackController.play' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'EVENT_DELAY_MS = 180L' android-native/app/src/main/java/com/amin/pocketgba/GraphGrowthPlaybackController.java
          grep -q 'ToneGenerator' android-native/app/src/main/java/com/amin/pocketgba/GraphGrowthPlaybackController.java
          grep -q 'evidence-only-reverse-v2' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'SCANNER_COMMAND_EVIDENCE_NOT_FOUND' android-native/app/src/main/java/com/amin/pocketgba/ScannerReverseDiscovery.java
          grep -q 'BuildConfig.SOURCE_REF' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'treeRevision' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          grep -q 'Scanner Reverse Discovery' android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          grep -q 'acceptPendingSourceRevision' android-native/app/src/main/assets/amin-wiki-graph/source-review.js

          ! grep -q 'buildGraph(JSONArray tree' android-native/app/src/main/java/com/amin/pocketgba/GitHubSourceGraphScanner.java
          ! grep -q 'semanticAnchor' android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          ! grep -q 'createElement.(.canvas' android-native/app/src/main/assets/amin-wiki-graph/source-review.js
          ! grep -Eq 'Runtime.getRuntime|ProcessBuilder|workflow_dispatch|mergePullRequest|createRelease' \
            android-native/app/src/main/java/com/amin/pocketgba/Capability*.java
          ! grep -Eq '/logs|Authorization|workflow_dispatch|/dispatches|/merges' \
            android-native/app/src/main/java/com/amin/pocketgba/GitHubWork*.java
          ! grep -Eq 'createElement.*canvas|new Canvas|<canvas' \
            android-native/app/src/main/java/com/amin/pocketgba/GitHub*.java

      - name: Install mature Java AST scanner
        shell: bash
        run: |
          set -euxo pipefail
          npm install --prefix tools/tree-sitter-scanner --ignore-scripts=false --no-audit --no-fund

      - name: Prove Scanner caller and architecture layers with Tree-sitter
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$AMIN_SOURCE_REVISION"
          mkdir -p build/scanner-evidence
          GITHUB_SHA="$AMIN_SOURCE_REVISION" node tools/tree-sitter-scanner/scan-java.cjs "$GITHUB_WORKSPACE" > build/scanner-evidence/tree-sitter-scanner.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('build/scanner-evidence/tree-sitter-scanner.json')
          data = json.loads(p.read_text())
          assert data['revision'] == os.environ['AMIN_SOURCE_REVISION']
          assert data['provider'] == 'tree-sitter-java'
          assert data['anchor']['verification'] == 'ast_verified'
          assert data['anchor']['evidence']['nodeType'] == 'method_declaration'
          assert len(data['relations']) == 1
          rel = data['relations'][0]
          assert rel['type'] == 'invoked_by'
          assert rel['verification'] == 'ast_verified'
          assert rel['evidence']['nodeType'] == 'method_invocation'
          assert rel['to'] == 'function:WikiGraphActivity.requestCloudSourceSync'

          expected = {
            'command': 'VoiceCommandCatalog',
            'capability': 'CapabilitySourceMap',
            'registry': 'NodeRegistry',
            'governance': 'RegistryApprovalActivity',
            'permission': 'PermissionCenterActivity',
          }
          artifacts = {a['layer']: a for a in data['artifacts']}
          assert set(artifacts) == set(expected)
          for layer, class_name in expected.items():
            item = artifacts[layer]
            assert item['className'] == class_name
            assert item['verification'] == 'ast_verified'
            assert item['authorityVerified'] is False
            assert item['declaration']['nodeType'] in ('class_declaration', 'interface_declaration', 'enum_declaration')
            assert isinstance(item['references'], list)

          structural = data['structuralRelations']
          assert isinstance(structural, list)
          for relation in structural:
            assert relation['type'] == 'references'
            assert relation['verification'] == 'ast_verified'
            assert relation['authorityVerified'] is False
            assert relation['from'].startswith('source-artifact:')
            assert relation['to'].startswith('source-artifact:')
            assert relation['evidence']['nodeType'] in ('identifier', 'type_identifier')

          assert data['gaps'][0]['code'] == 'SCANNER_COMMAND_EVIDENCE_NOT_FOUND'
          assert not any(a.get('authorityVerified') for a in data['artifacts'])
          assert not any(r.get('authorityVerified') for r in structural)
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

          mkdir -p android-native/app/src/main/assets/scanner-evidence
          cp build/scanner-evidence/tree-sitter-scanner.json \
            android-native/app/src/main/assets/scanner-evidence/tree-sitter-scanner.json
          test -s android-native/app/src/main/assets/scanner-evidence/tree-sitter-scanner.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate source and build
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p android-native \
            -PAMIN_VERSION_CODE="$AMIN_VERSION_CODE" \
            -PAMIN_VERSION_NAME="$AMIN_VERSION_NAME" \
            -PAMIN_BRIDGE_SUFFIX="$AMIN_BRIDGE_SUFFIX" \
            -PAMIN_SOURCE_REF="$AMIN_SOURCE_REVISION" \
            :app:testDebugUnitTest \
            :app:testBridgeUnitTest \
            :app:lintBridge \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest

      - name: Publish scanner evidence
        uses: actions/upload-artifact@v4
        with:
          name: amin-pr-${{ github.event.pull_request.number }}-scanner-evidence
          path: build/scanner-evidence/tree-sitter-scanner.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish PR test APK
        uses: actions/upload-artifact@v4
        with:
          name: amin-pr-${{ github.event.pull_request.number }}-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  emulator-acceptance:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read release metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path('android-native/release-version.json').read_text())
          print(f"AMIN_VERSION_CODE={data['versionCode']}")
          print(f"AMIN_VERSION_NAME={data['versionName']}")
          print(f"AMIN_BRIDGE_SUFFIX=-bridge{data['bridge']}")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 emulator tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-35' \
            'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64'

      - name: Enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug and instrumentation APKs
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p android-native \
            -PAMIN_VERSION_CODE="$AMIN_VERSION_CODE" \
            -PAMIN_VERSION_NAME="$AMIN_VERSION_NAME" \
            -PAMIN_BRIDGE_SUFFIX="$AMIN_BRIDGE_SUFFIX" \
            -PAMIN_SOURCE_REF="${{ github.event.pull_request.head.sha }}" \
            :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Boot Android 35 emulator
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name amin_phase1_step11_api35 \
            --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_7'
          nohup env -u RUNNER_TRACKING_ID ANDROID_AVD_HOME="$ANDROID_AVD_HOME" \
            "$ANDROID_HOME/emulator/emulator" -avd amin_phase1_step11_api35 -no-window \
            -gpu swiftshader_indirect -accel on -cores 2 -memory 3072 -noaudio \
            -no-boot-anim -no-snapshot -wipe-data -camera-back none \
            > "$RUNNER_TEMP/phase1-step11-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          adb start-server
          for attempt in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              cat "$RUNNER_TEMP/phase1-step11-emulator.log"
              exit 1
            fi
            if [ "$(adb get-state 2>/dev/null || true)" = device ] && \
               [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; then
              break
            fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk | grep -Fx 35

      - name: Install and verify launcher and Graph deep link
        shell: bash
        run: |
          set -euxo pipefail
          APP_APK='android-native/app/build/outputs/apk/debug/app-debug.apk'
          TEST_APK='android-native/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT" dump badging "$APP_APK" | tee "$RUNNER_TEMP/phase1-step11-badging.txt"
          grep -Fq "package: name='com.amin.pocketgba'" "$RUNNER_TEMP/phase1-step11-badging.txt"
          grep -Fq "launchable-activity:" "$RUNNER_TEMP/phase1-step11-badging.txt"
          adb install -r "$APP_APK"
          adb install -r "$TEST_APK"
          adb shell monkey -p com.amin.pocketgba -c android.intent.category.LAUNCHER 1
          adb shell am start -W -a android.intent.action.VIEW -d 'amin-graph://open' \
            -p com.amin.pocketgba | grep -F 'Status: ok'

      - name: Run GitHub Work, Step 11, and Focus Chain mobile acceptance tests
        shell: bash
        run: |
          set -euxo pipefail
          adb shell am instrument -w -r \
            -e class com.amin.pocketgba.WikiGraphActivityTest \
            com.amin.pocketgba.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/phase1-instrumentation.txt"
          grep -Eq 'OK \(2 tests\)' "$RUNNER_TEMP/phase1-instrumentation.txt"
          adb shell am instrument -w -r \
            -e class com.amin.pocketgba.CapabilityInventoryActivityTest \
            com.amin.pocketgba.test/androidx.test.runner.AndroidJUnitRunner \
            | tee "$RUNNER_TEMP/step11-instrumentation.txt"
          grep -Eq 'OK \(1 test\)' "$RUNNER_TEMP/step11-instrumentation.txt"

      - name: Publish integrated emulator acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: amin-pr-${{ github.event.pull_request.number }}-phase1-step11-emulator-acceptance
          path: |
            ${{ runner.temp }}/phase1-step11-badging.txt
            ${{ runner.temp }}/phase1-instrumentation.txt
            ${{ runner.temp }}/step11-instrumentation.txt
            ${{ runner.temp }}/phase1-step11-emulator.log
          if-no-files-found: error
          retention-days: 7
