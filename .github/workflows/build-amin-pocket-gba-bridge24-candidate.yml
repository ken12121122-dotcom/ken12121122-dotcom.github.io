name: Publish Amin Pocket GBA Bridge 26

on:
  pull_request:
    branches:
      - release/bridge23-amin-control-api-v1
    paths:
      - 'android-native/**'
      - '.github/workflows/build-amin-pocket-gba-bridge24-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  AMIN_KEYSTORE_BASE64: ${{ secrets.AMIN_KEYSTORE_BASE64 }}
  AMIN_KEYSTORE_PASSWORD: ${{ secrets.AMIN_KEYSTORE_PASSWORD }}
  AMIN_KEY_ALIAS: ${{ secrets.AMIN_KEY_ALIAS }}
  AMIN_KEY_PASSWORD: ${{ secrets.AMIN_KEY_PASSWORD }}

jobs:
  build-sign-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'release/bridge24-prompt-keyboard-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Bridge 26 source
        uses: actions/checkout@v6
        with:
          ref: release/bridge24-prompt-keyboard-v1
          fetch-depth: 0

      - name: Verify Bridge 26 identity
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq "'122'" android-native/app/build.gradle
          grep -Fq "'-bridge26'" android-native/app/build.gradle
          grep -Fq "versionName '0.9.4'" android-native/app/build.gradle
          grep -Fq "applicationId 'com.amin.pocketgba'" android-native/app/build.gradle
          grep -Fq 'class WikiGraphActivity' android-native/app/src/main/java/com/amin/pocketgba/WikiGraphActivity.java
          grep -Fq 'amin-wiki/pages' android-native/app/src/main/assets/amin-wiki-graph/index.html
          test -n "$AMIN_KEYSTORE_BASE64"
          test -n "$AMIN_KEYSTORE_PASSWORD"
          test -n "$AMIN_KEY_ALIAS"
          test -n "$AMIN_KEY_PASSWORD"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent signing
        shell: bash
        run: |
          set -euxo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/amin-pocket-gba.jks"
          printf '%s' "$AMIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "AMIN_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test lint and build signed Bridge 26
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p android-native \
            -PAMIN_VERSION_CODE=122 \
            -PAMIN_BRIDGE_SUFFIX=-bridge26 \
            :app:testDebugUnitTest \
            :app:testBridgeUnitTest \
            :app:lintBridge \
            :app:assembleBridge

      - name: Verify signed APK identity
        id: apk
        shell: bash
        run: |
          set -euxo pipefail
          APK='android-native/app/build/outputs/apk/bridge/app-bridge.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/bridge26-badging.txt"
          grep -Fq "package: name='com.amin.pocketgba' versionCode='122' versionName='0.9.4-bridge26'" "$RUNNER_TEMP/bridge26-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/bridge26-signing.txt"
          grep -Fqi '3b9a3125b2cd19389c284e834c4ff9eb67caeecb647fe41897d923169f4152c7' "$RUNNER_TEMP/bridge26-signing.txt"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish APK and manifest
        shell: bash
        env:
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          set -euxo pipefail
          RELEASE_NAME='Amin-Pocket-GBA-v0.9.4-bridge26.apk'
          RELEASE_PATH="amin-vault/releases/$RELEASE_NAME"
          mkdir -p amin-vault/releases
          cp "$APK" "$RELEASE_PATH"
          SHA256="$(sha256sum "$RELEASE_PATH" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$RELEASE_PATH")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$SHA256" "$SIZE" "$PUBLISHED_AT" <<'PY'
          import json, sys
          sha256, size, published_at = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          manifest = {
            "format": "amin-native-release-manifest",
            "manifestVersion": 1,
            "channel": "bridge",
            "enabled": True,
            "packageId": "com.amin.pocketgba",
            "latestVersionName": "0.9.4-bridge26",
            "latestVersionCode": 122,
            "minimumSupportedVersionCode": 107,
            "minimumAndroidSdk": 26,
            "apkUrl": "https://ken12121122-dotcom.github.io/amin-vault/releases/Amin-Pocket-GBA-v0.9.4-bridge26.apk",
            "apkSha256": sha256,
            "signerCertificateSha256": "3b9a3125b2cd19389c284e834c4ff9eb67caeecb647fe41897d923169f4152c7",
            "sizeBytes": size,
            "publishedAt": published_at,
            "mandatory": False,
            "releaseNotes": [
              "新增 Amin Wiki 關聯圖入口，固定只讀取 amin-wiki/pages。",
              "每個 Markdown 檔顯示為可拖曳節點，並依檔案連結產生關聯線。",
              "支援縮放、平移、點擊閱讀全文及警告節點。",
              "新增熱更新按鈕，可重新下載 Markdown 並重建圖譜。",
              "沿用原套件與永久簽章，可直接覆蓋既有版本。"
            ]
          }
          with open('amin-vault/native-release-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

      - name: Commit published Bridge 26
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add amin-vault/releases/Amin-Pocket-GBA-v0.9.4-bridge26.apk amin-vault/native-release-manifest.json
          git commit -m 'release: publish signed Bridge 26'
          git push origin HEAD:release/bridge24-prompt-keyboard-v1

      - name: Upload signed Bridge 26 evidence
        uses: actions/upload-artifact@v4
        with:
          name: Amin-Pocket-GBA-Bridge26-signed
          path: |
            amin-vault/releases/Amin-Pocket-GBA-v0.9.4-bridge26.apk
            amin-vault/native-release-manifest.json
            ${{ runner.temp }}/bridge26-badging.txt
            ${{ runner.temp }}/bridge26-signing.txt
          if-no-files-found: error
