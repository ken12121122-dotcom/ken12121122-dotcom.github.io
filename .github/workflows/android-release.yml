name: Android Production Release

on:
  workflow_dispatch:
  push:
    branches:
      - release/android
    paths:
      - 'android-native/**'

permissions:
  contents: write

concurrency:
  group: android-release-distribution
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      AMIN_KEYSTORE_BASE64: ${{ secrets.AMIN_KEYSTORE_BASE64 }}
      AMIN_KEYSTORE_PASSWORD: ${{ secrets.AMIN_KEYSTORE_PASSWORD }}
      AMIN_KEY_ALIAS: ${{ secrets.AMIN_KEY_ALIAS }}
      AMIN_KEY_PASSWORD: ${{ secrets.AMIN_KEY_PASSWORD }}
      AMIN_GITHUB_APP_CLIENT_ID: ${{ vars.AMIN_GITHUB_APP_CLIENT_ID }}

    steps:
      - name: Resolve distribution source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=release/android" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout distribution source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable scanner source revision
        shell: bash
        run: |
          set -euo pipefail
          REVISION="$(git rev-parse HEAD)"
          test -n "$REVISION"
          echo "AMIN_SOURCE_REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "Scanner source revision=$REVISION"

      - name: Read and validate release metadata
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          data = json.loads(Path('android-native/release-version.json').read_text())
          required = ['versionCode','versionName','channel','bridge','packageId','signerCertificateSha256','releaseNotes']
          missing = [k for k in required if k not in data]
          if missing:
              raise SystemExit(f'Missing release fields: {missing}')
          print(f"AMIN_VERSION_CODE={data['versionCode']}")
          print(f"AMIN_VERSION_NAME={data['versionName']}")
          print(f"AMIN_CHANNEL={data['channel']}")
          print(f"AMIN_BRIDGE={data['bridge']}")
          print(f"AMIN_BRIDGE_SUFFIX=-bridge{data['bridge']}")
          print(f"AMIN_PACKAGE_ID={data['packageId']}")
          print(f"AMIN_SIGNER_SHA256={data['signerCertificateSha256']}")
          print(f"AMIN_RELEASE_NAME=Amin-Pocket-GBA-v{data['versionName']}-bridge{data['bridge']}.apk")
          PY

      - name: Enforce distribution gate
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF='${{ steps.source.outputs.ref }}'
          if [ "$SOURCE_REF" = 'release/android' ]; then
            test "$AMIN_CHANNEL" != 'candidate'
          else
            test '${{ github.event_name }}' = 'workflow_dispatch'
            test "$AMIN_CHANNEL" = 'candidate'
          fi
          test -n "$AMIN_GITHUB_APP_CLIENT_ID"
          echo "Distribution source=$SOURCE_REF channel=$AMIN_CHANNEL versionCode=$AMIN_VERSION_CODE"

      - name: Install mature Java AST scanner
        shell: bash
        run: |
          set -euxo pipefail
          npm install --prefix tools/tree-sitter-scanner --ignore-scripts=false --no-audit --no-fund

      - name: Package revision-matched Tree-sitter evidence
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$AMIN_SOURCE_REVISION"
          mkdir -p build/scanner-evidence
          GITHUB_SHA="$AMIN_SOURCE_REVISION" node tools/tree-sitter-scanner/scan-java.cjs "$GITHUB_WORKSPACE" \
            > build/scanner-evidence/tree-sitter-scanner.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('build/scanner-evidence/tree-sitter-scanner.json')
          data = json.loads(p.read_text())
          assert data['revision'] == os.environ['AMIN_SOURCE_REVISION']
          assert data['provider'] == 'tree-sitter-java'
          assert data['gaps'][0]['code'] == 'SCANNER_COMMAND_EVIDENCE_NOT_FOUND'
          assert not any(a.get('authorityVerified') for a in data['artifacts'])
          assert not any(r.get('authorityVerified') for r in data['structuralRelations'])
          PY
          mkdir -p android-native/app/src/main/assets/scanner-evidence
          cp build/scanner-evidence/tree-sitter-scanner.json \
            android-native/app/src/main/assets/scanner-evidence/tree-sitter-scanner.json
          test -s android-native/app/src/main/assets/scanner-evidence/tree-sitter-scanner.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent signing
        shell: bash
        run: |
          set -euxo pipefail
          test -n "$AMIN_KEYSTORE_BASE64"
          test -n "$AMIN_KEYSTORE_PASSWORD"
          test -n "$AMIN_KEY_ALIAS"
          test -n "$AMIN_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/amin-pocket-gba.jks"
          printf '%s' "$AMIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "AMIN_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test lint and build signed APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --console=plain -p android-native \
            -PAMIN_VERSION_CODE="$AMIN_VERSION_CODE" \
            -PAMIN_VERSION_NAME="$AMIN_VERSION_NAME" \
            -PAMIN_BRIDGE_SUFFIX="$AMIN_BRIDGE_SUFFIX" \
            -PAMIN_SOURCE_REF="$AMIN_SOURCE_REVISION" \
            -PAMIN_GITHUB_APP_CLIENT_ID="$AMIN_GITHUB_APP_CLIENT_ID" \
            :app:testDebugUnitTest \
            :app:testBridgeUnitTest \
            :app:lintBridge \
            :app:assembleBridge

      - name: Verify APK identity permanent signer and scanner evidence
        shell: bash
        run: |
          set -euxo pipefail
          APK='android-native/app/build/outputs/apk/bridge/app-bridge.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/android-release-badging.txt"
          EXPECTED="package: name='$AMIN_PACKAGE_ID' versionCode='$AMIN_VERSION_CODE' versionName='$AMIN_VERSION_NAME$AMIN_BRIDGE_SUFFIX'"
          grep -Fq "$EXPECTED" "$RUNNER_TEMP/android-release-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/android-release-signing.txt"
          grep -Fqi "$AMIN_SIGNER_SHA256" "$RUNNER_TEMP/android-release-signing.txt"
          unzip -p "$APK" assets/scanner-evidence/tree-sitter-scanner.json > "$RUNNER_TEMP/tree-sitter-scanner.json"
          test -s "$RUNNER_TEMP/tree-sitter-scanner.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path(os.environ['RUNNER_TEMP'], 'tree-sitter-scanner.json').read_text())
          assert data['revision'] == os.environ['AMIN_SOURCE_REVISION']
          assert data['gaps'][0]['code'] == 'SCANNER_COMMAND_EVIDENCE_NOT_FOUND'
          PY

      - name: Create distribution artifact and manifest
        shell: bash
        run: |
          set -euxo pipefail
          APK='android-native/app/build/outputs/apk/bridge/app-bridge.apk'
          RELEASE_PATH="amin-vault/releases/$AMIN_RELEASE_NAME"
          mkdir -p amin-vault/releases
          cp "$APK" "$RELEASE_PATH"
          SHA256="$(sha256sum "$RELEASE_PATH" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$RELEASE_PATH")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$SHA256" "$SIZE" "$PUBLISHED_AT" "$AMIN_RELEASE_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          sha256, size, published_at, release_name = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
          v = json.loads(Path('android-native/release-version.json').read_text())
          manifest = {
            'format': 'amin-native-release-manifest',
            'manifestVersion': 1,
            'channel': v['channel'],
            'enabled': True,
            'packageId': v['packageId'],
            'latestVersionName': f"{v['versionName']}-bridge{v['bridge']}",
            'latestVersionCode': v['versionCode'],
            'minimumSupportedVersionCode': v['minimumSupportedVersionCode'],
            'minimumAndroidSdk': v['minimumAndroidSdk'],
            'apkUrl': f'https://ken12121122-dotcom.github.io/amin-vault/releases/{release_name}',
            'apkSha256': sha256,
            'signerCertificateSha256': v['signerCertificateSha256'],
            'sizeBytes': size,
            'publishedAt': published_at,
            'mandatory': False,
            'releaseNotes': v['releaseNotes'],
          }
          Path('amin-vault/native-release-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Publish APK and manifest to updater endpoint
        shell: bash
        run: |
          set -euxo pipefail
          STAGE="$RUNNER_TEMP/android-release-stage"
          mkdir -p "$STAGE"
          cp "amin-vault/releases/$AMIN_RELEASE_NAME" "$STAGE/$AMIN_RELEASE_NAME"
          cp amin-vault/native-release-manifest.json "$STAGE/native-release-manifest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard HEAD
          git clean -fd
          git checkout -B main origin/main
          mkdir -p amin-vault/releases
          cp "$STAGE/$AMIN_RELEASE_NAME" "amin-vault/releases/$AMIN_RELEASE_NAME"
          cp "$STAGE/native-release-manifest.json" amin-vault/native-release-manifest.json
          git add "amin-vault/releases/$AMIN_RELEASE_NAME" amin-vault/native-release-manifest.json
          git diff --cached --quiet && { echo 'Distribution already published'; exit 0; }
          git commit -m "release: publish $AMIN_CHANNEL $AMIN_VERSION_NAME$AMIN_BRIDGE_SUFFIX"
          git push origin HEAD:main

      - name: Upload distribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: Amin-Android-${{ env.AMIN_CHANNEL }}-${{ env.AMIN_VERSION_NAME }}${{ env.AMIN_BRIDGE_SUFFIX }}
          path: |
            amin-vault/releases/${{ env.AMIN_RELEASE_NAME }}
            amin-vault/native-release-manifest.json
            ${{ runner.temp }}/android-release-badging.txt
            ${{ runner.temp }}/android-release-signing.txt
            ${{ runner.temp }}/tree-sitter-scanner.json
          if-no-files-found: error
