name: Android Production Release

on:
  workflow_dispatch:
  push:
    branches: [release/android]
    paths: ['android-native/**']
  pull_request:
    branches: [release/android]
    paths: ['android-native/RELEASE_REQUEST.md']

permissions:
  contents: write

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release/publish-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AMIN_KEYSTORE_BASE64: ${{ secrets.AMIN_KEYSTORE_BASE64 }}
      AMIN_KEYSTORE_PASSWORD: ${{ secrets.AMIN_KEYSTORE_PASSWORD }}
      AMIN_KEY_ALIAS: ${{ secrets.AMIN_KEY_ALIAS }}
      AMIN_KEY_PASSWORD: ${{ secrets.AMIN_KEY_PASSWORD }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: release/android
          fetch-depth: 0

      - name: Read release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path
          v = json.loads(Path('android-native/release-version.json').read_text())
          for key in ('versionCode','versionName','bridge','packageId','signerCertificateSha256','releaseNotes'):
              if key not in v:
                  raise SystemExit(f'Missing release field: {key}')
          print(f"AMIN_VERSION_CODE={v['versionCode']}")
          print(f"AMIN_VERSION_NAME={v['versionName']}")
          print(f"AMIN_BRIDGE_SUFFIX=-bridge{v['bridge']}")
          print(f"AMIN_PACKAGE_ID={v['packageId']}")
          print(f"AMIN_SIGNER_SHA256={v['signerCertificateSha256']}")
          print(f"AMIN_RELEASE_NAME=Amin-Pocket-GBA-v{v['versionName']}-bridge{v['bridge']}.apk")
          PY

      - name: Validate graph JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('android-native/app/src/main/assets/amin-wiki-graph/index.html').read_text()
          if '<script>' not in html or '</script>' not in html:
              raise SystemExit('Graph HTML script block missing')
          js = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/amin-wiki-graph.js').write_text(js)
          PY
          node --check /tmp/amin-wiki-graph.js
          grep -Fq 'window.AminGraphSmoke' android-native/app/src/main/assets/amin-wiki-graph/index.html
          grep -Fq 'saveUnifiedEdgeJson' android-native/app/src/main/assets/amin-wiki-graph/index.html
          grep -Fq 'getRuntimeFlowTraceJson' android-native/app/src/main/assets/amin-wiki-graph/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare permanent signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AMIN_KEYSTORE_BASE64"
          test -n "$AMIN_KEYSTORE_PASSWORD"
          test -n "$AMIN_KEY_ALIAS"
          test -n "$AMIN_KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/amin-pocket-gba.jks"
          printf '%s' "$AMIN_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "AMIN_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test lint and build signed APK
        shell: bash
        run: |
          gradle --no-daemon --console=plain -p android-native \
            -PAMIN_VERSION_CODE="$AMIN_VERSION_CODE" \
            -PAMIN_VERSION_NAME="$AMIN_VERSION_NAME" \
            -PAMIN_BRIDGE_SUFFIX="$AMIN_BRIDGE_SUFFIX" \
            :app:testDebugUnitTest \
            :app:testBridgeUnitTest \
            :app:lintBridge \
            :app:assembleBridge

      - name: Verify APK identity and signer
        shell: bash
        run: |
          set -euo pipefail
          APK='android-native/app/build/outputs/apk/bridge/app-bridge.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/android-release-badging.txt"
          grep -Fq "package: name='$AMIN_PACKAGE_ID' versionCode='$AMIN_VERSION_CODE' versionName='$AMIN_VERSION_NAME$AMIN_BRIDGE_SUFFIX'" "$RUNNER_TEMP/android-release-badging.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/android-release-signing.txt"
          grep -Fqi "$AMIN_SIGNER_SHA256" "$RUNNER_TEMP/android-release-signing.txt"

      - name: Create release artifact and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK='android-native/app/build/outputs/apk/bridge/app-bridge.apk'
          RELEASE_PATH="amin-vault/releases/$AMIN_RELEASE_NAME"
          mkdir -p amin-vault/releases
          cp "$APK" "$RELEASE_PATH"
          SHA256="$(sha256sum "$RELEASE_PATH" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$RELEASE_PATH")"
          PUBLISHED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python3 - "$SHA256" "$SIZE" "$PUBLISHED_AT" "$AMIN_RELEASE_NAME" <<'PY'
          import json, sys
          from pathlib import Path
          sha256, size, published_at, release_name = sys.argv[1], int(sys.argv[2]), sys.argv[3], sys.argv[4]
          v = json.loads(Path('android-native/release-version.json').read_text())
          manifest = {
            'format': 'amin-native-release-manifest',
            'manifestVersion': 1,
            'channel': v['channel'],
            'enabled': True,
            'packageId': v['packageId'],
            'latestVersionName': f"{v['versionName']}-bridge{v['bridge']}",
            'latestVersionCode': v['versionCode'],
            'minimumSupportedVersionCode': v['minimumSupportedVersionCode'],
            'minimumAndroidSdk': v['minimumAndroidSdk'],
            'apkUrl': f'https://ken12121122-dotcom.github.io/amin-vault/releases/{release_name}',
            'apkSha256': sha256,
            'signerCertificateSha256': v['signerCertificateSha256'],
            'sizeBytes': size,
            'publishedAt': published_at,
            'mandatory': False,
            'releaseNotes': v['releaseNotes'],
          }
          Path('amin-vault/native-release-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Publish APK and manifest to main
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/android-release-stage"
          mkdir -p "$STAGE"
          cp "amin-vault/releases/$AMIN_RELEASE_NAME" "$STAGE/$AMIN_RELEASE_NAME"
          cp amin-vault/native-release-manifest.json "$STAGE/native-release-manifest.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p amin-vault/releases
          cp "$STAGE/$AMIN_RELEASE_NAME" "amin-vault/releases/$AMIN_RELEASE_NAME"
          cp "$STAGE/native-release-manifest.json" amin-vault/native-release-manifest.json
          git add "amin-vault/releases/$AMIN_RELEASE_NAME" amin-vault/native-release-manifest.json
          if git diff --cached --quiet; then
            echo 'Release already published'
            exit 0
          fi
          git commit -m "release: publish $AMIN_VERSION_NAME$AMIN_BRIDGE_SUFFIX"
          git push origin HEAD:main

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: Amin-Android-${{ env.AMIN_VERSION_NAME }}${{ env.AMIN_BRIDGE_SUFFIX }}
          path: |
            amin-vault/releases/${{ env.AMIN_RELEASE_NAME }}
            amin-vault/native-release-manifest.json
            ${{ runner.temp }}/android-release-badging.txt
            ${{ runner.temp }}/android-release-signing.txt
          if-no-files-found: error
