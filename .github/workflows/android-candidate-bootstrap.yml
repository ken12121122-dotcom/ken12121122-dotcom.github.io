name: Android Candidate Dispatch Bootstrap

on:
  push:
    branches:
      - feat/fox-pet-control-v1
    paths:
      - '.github/workflows/android-candidate-bootstrap.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch existing candidate release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/android-release.yml/dispatches"             -f ref="${GITHUB_REF_NAME}"
