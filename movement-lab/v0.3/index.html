<!doctype html><html lang="zh-Hant"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>Movement Lab</title><style>html,body{margin:0;overflow:hidden;background:#101820;touch-action:none}button,input{touch-action:none}#ui{position:fixed;inset:0;pointer-events:none;color:white;font:16px system-ui}button{pointer-events:auto;border:1px solid #ffffff66;background:#26343a99;color:white;border-radius:50%;width:56px;height:56px;font-size:25px;backdrop-filter:blur(9px)}#joy{position:absolute;left:22px;bottom:35px;width:125px;height:125px;border:2px solid #ffffff55;border-radius:50%;pointer-events:auto;background:#ffffff13;touch-action:none}#nub{position:absolute;left:41px;top:41px;width:43px;height:43px;border-radius:50%;background:#ffffff99}#buttons{position:absolute;right:20px;bottom:30px;display:grid;grid-template-columns:repeat(2,56px);gap:12px}#dial{position:absolute;right:20px;bottom:175px;opacity:.23;pointer-events:auto;display:none;align-items:center;justify-content:center;width:94px;height:94px;border-radius:50%;border:5px solid #bd9e68;background:#1a2931aa;color:white;font-size:20px;touch-action:none}#dial.active{opacity:1}#top{position:absolute;top:16px;right:18px;display:flex;gap:8px}#setup{position:absolute;inset:0;background:#0b121bfa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;pointer-events:auto}#setup input{font-size:20px;padding:12px;background:#26343a;color:white;border:1px solid #aaa;border-radius:10px}#setup button{border-radius:16px;width:auto;padding:0 30px}</style><div id="ui"><div id="setup"><input id="seed" value="20261028" aria-label="Seed"><button id="enter">▶</button></div><div id="joy"><div id="nub"></div></div><div id="buttons"><button id="run">➤</button><button id="jump">↑</button><button id="crouch">↓</button><button id="view">◉</button></div><div id="dial">3.0</div><div id="top"><button id="reset">↺</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cb7c3);scene.fog=new THREE.Fog(0x9cb7c3,65,170);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,250);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x5d7063,2.3));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(20,35,12);scene.add(sun);
const groundMat=new THREE.MeshStandardMaterial({color:0x678b6d,roughness:1});let ground;
function noise(x,z,seed){let n=Math.sin(x*127.1+z*311.7+seed*0.01)*43758.5453;return n-Math.floor(n)}
let seed=20261028;
function height(x,z){return Math.sin(x*.095+seed*.001)*1.1+Math.cos(z*.08-seed*.002)*1.2+Math.sin(x*.04+z*.06)*1.8}
function world(){if(ground){scene.remove(ground);ground.geometry.dispose()}const geo=new THREE.PlaneGeometry(240,240,120,120);geo.rotateX(-Math.PI/2);const p=geo.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,height(p.getX(i),p.getZ(i)));geo.computeVertexNormals();ground=new THREE.Mesh(geo,groundMat);scene.add(ground)}
const player=new THREE.Group();scene.add(player);const body=new THREE.Mesh(new THREE.SphereGeometry(.48,24,16),new THREE.MeshStandardMaterial({color:0xe7ba65,metalness:.2,roughness:.5}));body.position.y=.8;player.add(body);const nose=new THREE.Mesh(new THREE.ConeGeometry(.16,.52,8),new THREE.MeshStandardMaterial({color:0x334e5b}));nose.rotation.x=Math.PI/2;nose.position.set(0,.8,.5);player.add(nose);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(.48,32),new THREE.MeshBasicMaterial({color:0x1c292b,transparent:true,opacity:.24,depthWrite:false}));shadow.rotation.x=-Math.PI/2;scene.add(shadow);
let stick={x:0,y:0},running=false,crouching=false,vy=0,alt=0,speed=0,yaw=0,camYaw=0,camPitch=.35,follow=true,turn=null,joystickDown=false;const joy=document.querySelector('#joy'),nub=document.querySelector('#nub'),dial=document.querySelector('#dial');
function joyMove(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,m/55);stick={x:dx/m*k,y:-dy/m*k};nub.style.transform='translate('+stick.x*42+'px,'+(-stick.y*42)+'px)'}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joystickDown=true;joyMove(e)});joy.addEventListener('pointermove',e=>{if(joystickDown)joyMove(e)});function release(){joystickDown=false;stick={x:0,y:0};nub.style.transform=''}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
document.querySelector('#run').onclick=()=>{running=!running;dial.style.display=running?'flex':'none'};document.querySelector('#crouch').onclick=()=>crouching=!crouching;document.querySelector('#jump').onclick=()=>{if(alt<=.001){vy=5.7;crouching=false}};document.querySelector('#view').onclick=()=>follow=!follow;document.querySelector('#reset').onclick=()=>{player.position.set(0,0,0);speed=0;alt=0;vy=0};
let maxRun=4.5,hold=null,adjust=false;
dial.addEventListener('pointerdown',e=>{dial.setPointerCapture(e.pointerId);hold=setTimeout(()=>{adjust=true;dial.classList.add('active')},250)});
dial.addEventListener('pointermove',e=>{if(!adjust)return;const r=dial.getBoundingClientRect(),a=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);maxRun=1.5+(a+Math.PI)/(2*Math.PI)*8;dial.textContent=maxRun.toFixed(1)});
function dialRelease(){clearTimeout(hold);adjust=false;dial.classList.remove('active')}dial.addEventListener('pointerup',dialRelease);dial.addEventListener('pointercancel',dialRelease);
let camPointer=null,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{camPointer=e.pointerId;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(camPointer!==e.pointerId||follow)return;camYaw-=(e.clientX-lastX)*.006;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-lastY)*.004,-.15,1.15);lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>camPointer=null);
document.querySelector('#enter').onclick=()=>{seed=Number(document.querySelector('#seed').value)||0;world();document.querySelector('#setup').style.display='none'};world();
const clock=new THREE.Clock();function angleDelta(a,b){return Math.atan2(Math.sin(b-a),Math.cos(b-a))}
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.04),strength=Math.hypot(stick.x,stick.y);let desired=0;
if(strength>.08){const target=Math.atan2(stick.x,stick.y)+camYaw;const diff=angleDelta(yaw,target);if(!turn&&Math.abs(diff)>2.35&&speed>.6)turn={phase:0,elapsed:0,from:yaw,to:yaw+diff};if(turn){turn.elapsed+=dt;const t=turn.elapsed;if(t<.18)desired=0;else if(t<.29)desired=0;else if(t<.64){const p=Math.min(1,(t-.29)/.35),ease=p*p*(3-2*p);yaw=turn.from+(turn.to-turn.from)*ease;desired=0}else{yaw=turn.to;turn=null;desired=strength*(running?maxRun:2.1)}}else{yaw+=diff*Math.min(1,dt*7);desired=strength*(running?maxRun:2.1)}}else{turn=null;desired=0}
if(crouching)desired=Math.min(desired,.9);speed+=(desired-speed)*Math.min(1,dt*(desired<speed?10:5));
player.position.x+=Math.sin(yaw)*speed*dt;player.position.z+=Math.cos(yaw)*speed*dt;
vy-=13*dt;alt=Math.max(0,alt+vy*dt);if(alt===0)vy=0;
const floor=height(player.position.x,player.position.z);player.position.y=floor+alt;player.rotation.y=yaw;body.position.y+=( (crouching?.48:.8)-body.position.y)*Math.min(1,dt*10);body.scale.y+=( (crouching?.65:1)-body.scale.y)*Math.min(1,dt*10);nose.position.y=body.position.y;
shadow.position.set(player.position.x,floor+.035,player.position.z);shadow.material.opacity=.24/(1+alt);
if(follow)camYaw+=angleDelta(camYaw,yaw)*Math.min(1,dt*2.8);
const focus=new THREE.Vector3(player.position.x,player.position.y+1,player.position.z);const dist=6.8;camera.position.set(focus.x-Math.sin(camYaw)*dist*Math.cos(camPitch),focus.y+Math.sin(camPitch)*dist+1,focus.z-Math.cos(camYaw)*dist*Math.cos(camPitch));camera.lookAt(focus);renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></html>
