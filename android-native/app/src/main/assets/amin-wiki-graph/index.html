dots.onclick=e=>{e.stopPropagation();if(menuNode)hub(menuNode)};c.addEventListener('pointerdown',e=>{c.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});hideDots();moved=false;if(pointers.size===1){drag=hit(e.clientX,e.clientY);last={x:e.clientX,y:e.clientY}}else if(pointers.size===2){drag=null;let p=[...pointers.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};gesture={d:Math.max(10,Math.hypot(dx,dy)),s:scale,wx:(mid.x-ox)/scale,wy:(mid.y-oy)/scale}}e.preventDefault()});c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&gesture){let p=[...pointers.values()].slice(0,2),dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};scale=Math.max(.25,Math.min(3.5,gesture.s*Math.hypot(dx,dy)/gesture.d));ox=mid.x-gesture.wx*scale;oy=mid.y-gesture.wy*scale;moved=true;draw();return}if(last&&pointers.size===1){let dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(drag){drag.x+=dx/scale;drag.y+=dy/scale}else{ox+=dx;oy+=dy}last={x:e.clientX,y:e.clientY};draw()}e.preventDefault()});function up(e){let d=drag,m=moved;pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(!pointers.size){drag=null;last=null;if(d&&!m)tap(d)}e.preventDefault()}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});function zoom(f,cx=innerWidth/2,cy=innerHeight/2){let old=scale,n=Math.max(.25,Math.min(3.5,old*f)),wx=(cx-ox)/old,wy=(cy-oy)/old;scale=n;ox=cx-wx*n;oy=cy-wy*n;draw()}function fit(){if(!nodes.length)return;let a=Infinity,b=Infinity,d=-Infinity,e=-Infinity;for(const n of nodes){a=Math.min(a,n.x-n.w/2);d=Math.max(d,n.x+n.w/2);b=Math.min(b,n.y-n.h/2);e=Math.max(e,n.y+n.h/2)}scale=Math.max(.25,Math.min(2,Math.min((innerWidth-120)/M
