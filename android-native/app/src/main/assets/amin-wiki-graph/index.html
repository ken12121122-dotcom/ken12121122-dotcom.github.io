<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amin Semantic Knowledge Graph</title>
<style>
:root{--bg:#f4f7f6;--panel:#fff;--text:#17211b;--muted:#6f7a73;--border:#d7e1db;--line:#8aa79a;--domain:#3e6f95;--group:#497d62;--node:#7653bd;--detail:#b56f28;--danger:#b64343}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:10;display:flex;align-items:center;gap:7px}.bar button{border:1px solid var(--border);background:color-mix(in srgb,var(--panel) 94%,transparent);color:var(--text);border-radius:999px;padding:8px 10px;font-weight:700;font-size:12px}.title{min-width:0;flex:1;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.level{font-weight:800;color:var(--domain)}
.nav{position:fixed;right:10px;bottom:55px;z-index:8;display:flex;flex-direction:column;gap:6px}.nav button{height:39px;min-width:48px;padding:0 9px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;font-weight:800}
.status{position:fixed;z-index:9;left:50%;bottom:9px;transform:translateX(-50%);max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:11px;color:var(--muted)}
.legend{position:fixed;left:9px;bottom:45px;z-index:7;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--border);border-radius:11px;padding:6px 8px;line-height:1.5}.legend b{color:var(--text)}
.empty{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:min(440px,86vw);padding:22px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--border);border-radius:18px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,.08)}.empty h2{margin:0 0 8px;font-size:18px}.empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}.empty code{font-size:11px}
.panel{position:fixed;right:12px;top:62px;z-index:12;width:min(390px,calc(100vw - 24px));max-height:50vh;overflow:auto;display:none;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 16px 45px rgba(0,0,0,.18)}.panel.open{display:block}.panel h3{margin:0 0 6px}.panel p{margin:6px 0;color:var(--muted);font-size:12px;line-height:1.55}.panel button{float:right;border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:6px 9px}
</style>
</head>
<body>
<canvas id="graph"></canvas>
<div class="bar"><button id="back">返回</button><div class="title">Amin Knowledge Architecture · <span id="levelText" class="level">Domain</span></div><button id="reload">更新</button></div>
<div class="nav"><button id="zin">＋</button><button id="zout">−</button><button id="fit">Fit</button><button id="reset">Reset</button></div>
<div class="legend"><b>Semantic Zoom</b><br>Detail → Node → Group → Domain</div>
<div id="status" class="status">Graph Engine v42 · loading</div>
<div id="empty" class="empty" hidden><h2>知識地圖載入失敗</h2><p>Canonical graph 無法讀取。Android 版應由 AminWiki asset bridge 載入；瀏覽器版使用 JSON fetch fallback。</p></div>
<div id="panel" class="panel"><button id="panelClose">關閉</button><h3 id="panelTitle"></h3><p id="panelBody"></p></div>
<script>
(()=>{'use strict';
const ENGINE='v42';
const DATA_URL='./knowledge-architecture.json';
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),empty=document.getElementById('empty'),levelText=document.getElementById('levelText'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelBody=document.getElementById('panelBody');
let graph=null,scale=.52,ox=innerWidth/2,oy=innerHeight/2,lastLevel='domain',lastScale=scale,pointers=new Map(),gesture=null,lastPointer=null,dragging=false,selected=null,dataSource='';
const css=()=>getComputedStyle(document.documentElement);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function validate(g){if(!g||typeof g!=='object')throw Error('knowledge-architecture.json invalid');for(const k of ['domains','groups','nodes','relations'])if(!Array.isArray(g[k]))throw Error('Missing array: '+k);if(!g.semanticZoom||!Array.isArray(g.semanticZoom.levels))throw Error('Missing semanticZoom.levels');return g}
function levels(){return [...graph.semanticZoom.levels].sort((a,b)=>b.minScale-a.minScale)}
function directLevel(s){let lv=levels();return (lv.find(x=>s>=Number(x.minScale||0))||lv[lv.length-1]).id}
function semanticLevel(s){if(!graph)return'domain';let lv=levels(),h=Number(graph.semanticZoom.hysteresis||1.08),idx=Math.max(0,lv.findIndex(x=>x.id===lastLevel));if(lastScale===s)return lastLevel;if(s>lastScale){while(idx>0&&s>=Number(lv[idx-1].minScale||0)*h)idx--}else{while(idx<lv.length-1&&s<Number(lv[idx].minScale||0)/h)idx++}lastScale=s;lastLevel=lv[idx]?.id||directLevel(s);return lastLevel}
function maps(){return{domains:new Map(graph.domains.map(x=>[x.id,x])),groups:new Map(graph.groups.map(x=>[x.id,x])),nodes:new Map(graph.nodes.map(x=>[x.id,x]))}}
function entityLevel(id,level,m){if(level==='detail'||level==='node')return m.nodes.get(id)||null;if(level==='group'){let n=m.nodes.get(id);if(n)return m.groups.get(n.groupId)||null;let g=m.groups.get(id);return g||null}if(level==='domain'){let n=m.nodes.get(id);if(n){let g=m.groups.get(n.groupId);return g?m.domains.get(g.domainId)||null:null}let g=m.groups.get(id);if(g)return m.domains.get(g.domainId)||null;return m.domains.get(id)||null}return null}
function levelEntities(level){if(level==='domain')return graph.domains;if(level==='group')return graph.groups;return graph.nodes}
function colorFor(level){let c=css();return c.getPropertyValue(level==='domain'?'--domain':level==='group'?'--group':level==='detail'?'--detail':'--node').trim()}
function autoLayout(items,level){let cols=Math.max(1,Math.ceil(Math.sqrt(items.length||1))),sx=level==='detail'?330:level==='node'?220:level==='group'?300:380,sy=level==='detail'?190:level==='node'?145:level==='group'?190:230;return items.map((it,i)=>({...it,_x:Number.isFinite(it.x)?it.x:(i%cols-(cols-1)/2)*sx,_y:Number.isFinite(it.y)?it.y:(Math.floor(i/cols)-(Math.ceil(items.length/cols)-1)/2)*sy}))}
function aggregateRelations(level,items){let m=maps(),ids=new Set(items.map(x=>x.id)),a=new Map();for(const r of graph.relations){let A=entityLevel(r.from,level,m),B=entityLevel(r.to,level,m);if(!A||!B||A.id===B.id||!ids.has(A.id)||!ids.has(B.id))continue;let k=A.id+'→'+B.id,old=a.get(k);if(old)old.count++;else a.set(k,{from:A.id,to:B.id,type:r.type||'related',count:1})}return[...a.values()]}
function current(){let level=semanticLevel(scale),items=autoLayout(levelEntities(level),level),rels=aggregateRelations(level,items);levelText.textContent=level[0].toUpperCase()+level.slice(1);return{level,items,rels}}
function screen(x,y){return{x:x*scale+ox,y:y*scale+oy}}
function line(a,b){let mx=(a.x+b.x)/2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(mx,a.y);ctx.lineTo(mx,b.y);ctx.lineTo(b.x,b.y)}
function roundRect(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
function drawEntity(e,level){let p=screen(e._x,e._y),color=colorFor(level);ctx.save();if(level==='detail'){let w=260*scale,h=138*scale;roundRect(p.x-w/2,p.y-h/2,w,h,Math.max(8,14*scale));ctx.fillStyle='#fff';ctx.strokeStyle=color;ctx.lineWidth=2;ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.font=`800 ${Math.max(10,15*scale)}px sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(e.title||e.name||e.id,p.x-w/2+12*scale,p.y-h/2+12*scale,Math.max(80,w-24*scale));let detail=String(e.detail||e.summary||'').replace(/\s+/g,' ');ctx.fillStyle='#536159';ctx.font=`500 ${Math.max(9,11*scale)}px sans-serif`;let max=Math.max(80,w-24*scale),words=detail.split(' '),line='',yy=p.y-h/2+42*scale;for(const word of words){let test=line?line+' '+word:word;if(ctx.measureText(test).width>max){ctx.fillText(line,p.x-w/2+12*scale,yy,max);line=word;yy+=16*scale;if(yy>p.y+h/2-18*scale)break}else line=test}if(line&&yy<=p.y+h/2-18*scale)ctx.fillText(line,p.x-w/2+12*scale,yy,max)}else{let radius=(level==='domain'?40:level==='group'?29:18)*clamp(scale,.55,1.5);ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fillStyle=color;ctx.globalAlpha=.93;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#17211b';ctx.font=`800 ${Math.max(10,(level==='domain'?16:level==='group'?14:12)*clamp(scale,.7,1.3))}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(e.title||e.name||e.id,p.x,p.y+radius+7,220)}if(selected===e.id){ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.strokeRect(p.x-34,p.y-34,68,68)}ctx.restore()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);if(!graph)return;let {level,items,rels}=current(),by=new Map(items.map(x=>[x.id,x]));ctx.save();ctx.strokeStyle=css().getPropertyValue('--line').trim();ctx.globalAlpha=.7;for(const r of rels){let A=by.get(r.from),B=by.get(r.to);if(!A||!B)continue;let a=screen(A._x,A._y),b=screen(B._x,B._y);ctx.lineWidth=Math.min(6,1.2+Math.log2(r.count+1));line(a,b);ctx.stroke()}ctx.restore();for(const e of items)drawEntity(e,level);empty.hidden=items.length!==0;status.textContent=`Graph Engine ${ENGINE} · ${dataSource||'unknown'} · ${level} · Domain ${graph.domains.length} · Group ${graph.groups.length} · Node ${graph.nodes.length} · Relation ${graph.relations.length}`}
function hit(px,py){if(!graph)return null;let {level,items}=current(),best=null,bd=Infinity;for(const e of items){let p=screen(e._x,e._y),d=Math.hypot(px-p.x,py-p.y),limit=level==='detail'?90:level==='domain'?62:level==='group'?50:38;if(d<limit&&d<bd){best=e;bd=d}}return best}
function show(e){if(!e)return;selected=e.id;panelTitle.textContent=e.title||e.name||e.id;panelBody.textContent=e.detail||e.summary||`ID: ${e.id}`;panel.classList.add('open');draw()}
function zoom(f,cx=innerWidth/2,cy=innerHeight/2){let old=scale,n=clamp(old*f,.14,3.2),wx=(cx-ox)/old,wy=(cy-oy)/old;scale=n;ox=cx-wx*n;oy=cy-wy*n;draw()}
function fit(){if(!graph)return;let {level,items}=current();if(!items.length){scale=.52;lastScale=scale;lastLevel=directLevel(scale);ox=innerWidth/2;oy=innerHeight/2;draw();return}let xs=items.map(x=>x._x),ys=items.map(x=>x._y),minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys),pad=120;let s=Math.min((innerWidth-pad)/Math.max(240,maxX-minX+240),(innerHeight-pad)/Math.max(160,maxY-minY+160));scale=clamp(s,.18,1.7);lastScale=scale;lastLevel=directLevel(scale);ox=innerWidth/2-(minX+maxX)/2*scale;oy=innerHeight/2-(minY+maxY)/2*scale;draw()}
function resize(){let d=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*d;canvas.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){lastPointer={x:e.clientX,y:e.clientY};dragging=false}else if(pointers.size===2){let p=[...pointers.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};gesture={d:Math.max(10,Math.hypot(dx,dy)),s:scale,wx:(mid.x-ox)/scale,wy:(mid.y-oy)/scale}}e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&gesture){let p=[...pointers.values()].slice(0,2),dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};let n=clamp(gesture.s*Math.hypot(dx,dy)/gesture.d,.14,3.2);scale=n;ox=mid.x-gesture.wx*n;oy=mid.y-gesture.wy*n;dragging=true;draw();return}if(lastPointer){let dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;if(Math.abs(dx)+Math.abs(dy)>3)dragging=true;ox+=dx;oy+=dy;lastPointer={x:e.clientX,y:e.clientY};draw()}e.preventDefault()});
function pointerUp(e){let was=dragging;pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(!pointers.size){if(!was)show(hit(e.clientX,e.clientY));lastPointer=null;dragging=false}e.preventDefault()}canvas.addEventListener('pointerup',pointerUp);canvas.addEventListener('pointercancel',pointerUp);
async function load(){status.textContent=`Graph Engine ${ENGINE} · loading`;try{let data=null;dataSource='';if(window.AminWiki&&typeof window.AminWiki.getKnowledgeArchitectureJson==='function'){let raw=window.AminWiki.getKnowledgeArchitectureJson();if(raw&&String(raw).trim()){data=JSON.parse(raw);dataSource='android-asset-bridge'}}if(!data){let r=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('dataset '+r.status);data=await r.json();dataSource='fetch-fallback'}graph=validate(data);lastLevel=directLevel(scale);lastScale=scale;fit()}catch(e){dataSource='error';graph={semanticZoom:{hysteresis:1.08,levels:[{id:'detail',minScale:1.25},{id:'node',minScale:.68},{id:'group',minScale:.36},{id:'domain',minScale:0}]},domains:[],groups:[],nodes:[],relations:[]};empty.hidden=false;status.textContent=`Graph Engine ${ENGINE} · dataset error: ${e.message}`;draw()}}
document.getElementById('zin').onclick=()=>zoom(1.2);document.getElementById('zout').onclick=()=>zoom(.82);document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{scale=.52;lastScale=scale;lastLevel=directLevel(scale);ox=innerWidth/2;oy=innerHeight/2;selected=null;panel.classList.remove('open');draw()};document.getElementById('reload').onclick=load;document.getElementById('panelClose').onclick=()=>{selected=null;panel.classList.remove('open');draw()};document.getElementById('back').onclick=()=>{if(window.AminGraphBack())return;window.AminWiki?window.AminWiki.close():history.back()};
window.AminGraphBack=()=>{if(panel.classList.contains('open')){selected=null;panel.classList.remove('open');draw();return true}return false};window.AminReloadKnowledgeArchitecture=()=>{load();return true};resize();load();
})();
</script>
</body>
</html>
