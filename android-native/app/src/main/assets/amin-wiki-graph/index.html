<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Amin Unified Graph</title>
<style>
:root{--bg:#f4f7f6;--panel:#fff;--text:#17211b;--muted:#6f7a73;--border:#d7e1db;--line:#8aa79a;--domain:#315f82;--group:#497d62;--node:#7653bd;--command:#b56f28;--active:#16a05d;--blocked:#b64343}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text)}button{font:inherit}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.bar{position:fixed;left:8px;right:8px;top:max(8px,env(safe-area-inset-top));z-index:10;display:flex;gap:7px;align-items:center}.bar button,.nav button,.panel button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 10px;font-weight:700}.title{min-width:0;flex:1;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nav{position:fixed;right:10px;bottom:54px;z-index:8;display:flex;flex-direction:column;gap:6px}.status{position:fixed;z-index:9;left:50%;bottom:9px;transform:translateX(-50%);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel);border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:11px;color:var(--muted)}.legend{position:fixed;left:9px;bottom:44px;z-index:7;font-size:10px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:6px 8px;line-height:1.55}.panel{position:fixed;right:12px;top:60px;z-index:12;width:min(390px,calc(100vw - 24px));max-height:55vh;overflow:auto;display:none;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 16px 45px rgba(0,0,0,.18)}.panel.open{display:block}.panel h3{margin:0 0 6px}.panel p{margin:5px 0;color:var(--muted);font-size:12px;white-space:pre-wrap}.panel .row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<canvas id="graph"></canvas>
<div class="bar"><button id="back">返回</button><div class="title">Amin Unified Graph · <span id="levelText">Domain</span></div></div>
<div class="nav"><button id="zin">＋</button><button id="zout">−</button><button id="fit">Fit</button><button id="reset">Reset</button></div>
<div class="legend">最遠：System<br>中層：Group<br>最底：NODE / COMMAND<br>線：Connect</div>
<div id="status" class="status">loading</div>
<div id="empty" class="empty" hidden>Registry 目前沒有可顯示的 Entity</div>
<div id="panel" class="panel"><h3 id="panelTitle"></h3><p id="panelBody"></p><div class="row"><button id="inspect">詳細</button><button id="source">設起點</button><button id="connect">連到這裡</button><button id="close">關閉</button></div></div>
<script>
(()=>{'use strict';
const MIN=.14,MAX=3.2,LEVELS=[['detail',1.25],['node',.68],['group',.36],['domain',0]],DEFAULT_SCALE=.52;
const c=document.getElementById('graph'),ctx=c.getContext('2d'),status=document.getElementById('status'),levelText=document.getElementById('levelText'),empty=document.getElementById('empty'),panel=document.getElementById('panel'),panelTitle=document.getElementById('panelTitle'),panelBody=document.getElementById('panelBody');
let graph=null,scale=DEFAULT_SCALE,ox=innerWidth/2,oy=innerHeight/2,lastLevel='domain',lastScale=scale,pointers=new Map(),gesture=null,lastPointer=null,dragging=false,selected=null,selectedEntity=null,connectSource='',positions={},runtimeEdges=new Map();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function validate(g){if(!g||typeof g!=='object')throw Error('invalid graph');for(const k of['domains','groups','nodes','relations'])if(!Array.isArray(g[k]))throw Error('missing '+k);return g}
function directLevel(s){return(LEVELS.find(x=>s>=x[1])||LEVELS[LEVELS.length-1])[0]}
function semanticLevel(s){if(!graph)return'domain';let h=Number(graph.semanticZoom?.hysteresis||1.08),idx=Math.max(0,LEVELS.findIndex(x=>x[0]===lastLevel));if(s>lastScale){while(idx>0&&s>=LEVELS[idx-1][1]*h)idx--}else if(s<lastScale){while(idx<LEVELS.length-1&&s<LEVELS[idx][1]/h)idx++}lastScale=s;lastLevel=LEVELS[idx]?.[0]||directLevel(s);return lastLevel}
function maps(){return{d:new Map(graph.domains.map(x=>[x.id,x])),g:new Map(graph.groups.map(x=>[x.id,x])),n:new Map(graph.nodes.map(x=>[x.id,x]))}}
function entityFor(id,level,m){if(level==='detail'||level==='node')return m.n.get(id)||null;if(level==='group'){let n=m.n.get(id);return n?m.g.get(n.groupId)||null:m.g.get(id)||null}if(level==='domain'){let n=m.n.get(id);if(n){let g=m.g.get(n.groupId);return g?m.d.get(g.domainId)||null:null}let g=m.g.get(id);return g?m.d.get(g.domainId)||null:m.d.get(id)||null}return null}
function entities(level){return level==='domain'?graph.domains:level==='group'?graph.groups:graph.nodes}
function autoLayout(items,level){let cols=Math.max(1,Math.ceil(Math.sqrt(items.length||1))),sx=level==='detail'?320:level==='node'?220:level==='group'?310:390,sy=level==='detail'?185:level==='node'?145:level==='group'?190:230;return items.map((it,i)=>{let p=positions[it.id],x=p?.x??((i%cols-(cols-1)/2)*sx),y=p?.y??((Math.floor(i/cols)-(Math.ceil(items.length/cols)-1)/2)*sy);return{...it,_x:x,_y:y}})}
function aggregate(level,items){let m=maps(),ids=new Set(items.map(x=>x.id)),out=new Map();for(const r of graph.relations){let A=entityFor(r.from,level,m),B=entityFor(r.to,level,m);if(!A||!B||A.id===B.id||!ids.has(A.id)||!ids.has(B.id))continue;let k=A.id+'→'+B.id,old=out.get(k);if(old)old.count++;else out.set(k,{id:r.id,from:A.id,to:B.id,type:r.type||'related_to',count:1,raw:r})}return[...out.values()]}
function current(){let level=semanticLevel(scale),items=autoLayout(entities(level),level),rels=aggregate(level,items);levelText.textContent=level;return{level,items,rels}}
function screen(x,y){return{x:x*scale+ox,y:y*scale+oy}}
function world(x,y){return{x:(x-ox)/scale,y:(y-oy)/scale}}
function color(e,level){let css=getComputedStyle(document.documentElement);if(level==='domain')return css.getPropertyValue('--domain').trim();if(level==='group')return css.getPropertyValue('--group').trim();return css.getPropertyValue(e.entityType==='command'?'--command':'--node').trim()}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function drawEntity(e,level){let p=screen(e._x,e._y),clr=color(e,level);ctx.save();if(level==='detail'){let w=270*scale,h=115*scale,left=p.x-w/2,top=p.y-h/2;roundRect(left,top,w,h,14*scale);ctx.fillStyle='#fff';ctx.strokeStyle=clr;ctx.lineWidth=2;ctx.fill();ctx.stroke();ctx.fillStyle=clr;ctx.font=`800 ${Math.max(10,15*scale)}px sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(e.title||e.id,left+12*scale,top+11*scale,w-24*scale);ctx.fillStyle='#536159';ctx.font=`500 ${Math.max(9,11*scale)}px sans-serif`;let txt=String(e.detail||e.summary||'').replace(/\n/g,' · ');ctx.fillText(txt.slice(0,110),left+12*scale,top+38*scale,w-24*scale);if(selected===e.id){ctx.strokeStyle='#111';ctx.setLineDash([6,5]);ctx.strokeRect(left-3,top-3,w+6,h+6)}ctx.restore();return}
let radius=(level==='domain'?42:level==='group'?30:19)*clamp(scale,.55,1.5);ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fillStyle=clr;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text').trim();ctx.font=`800 ${Math.max(9,(level==='domain'?16:level==='group'?14:12)*clamp(scale,.7,1.3))}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(e.title||e.id,p.x,p.y+radius+7,220);if(selected===e.id){ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.strokeRect(p.x-34,p.y-34,68,68)}ctx.restore()}
function edgeStatus(r){let direct=runtimeEdges.get(r.id);if(direct)return direct.status;for(const x of runtimeEdges.values())if(x.from===r.raw?.from&&x.to===r.raw?.to)return x.status;return''}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);if(!graph)return;let{level,items,rels}=current(),by=new Map(items.map(x=>[x.id,x]));for(const r of rels){let A=by.get(r.from),B=by.get(r.to);if(!A||!B)continue;let a=screen(A._x,A._y),b=screen(B._x,B._y),st=edgeStatus(r);ctx.beginPath();ctx.moveTo(a.x,a.y);let mx=(a.x+b.x)/2;ctx.lineTo(mx,a.y);ctx.lineTo(mx,b.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=st==='blocked'?getComputedStyle(document.documentElement).getPropertyValue('--blocked').trim():st?getComputedStyle(document.documentElement).getPropertyValue('--active').trim():getComputedStyle(document.documentElement).getPropertyValue('--line').trim();ctx.lineWidth=st?4:Math.min(5,1.4+Math.log2(r.count+1));ctx.globalAlpha=st?1:.72;ctx.stroke();ctx.globalAlpha=1}for(const e of items)drawEntity(e,level);empty.hidden=items.length!==0;status.textContent=`${level} · NODE ${graph.nodes.filter(x=>x.entityType==='node').length} · COMMAND ${graph.nodes.filter(x=>x.entityType==='command').length} · CONNECT ${graph.relations.length}${connectSource?' · 起點 '+connectSource:''}`}
function hit(px,py){let{level,items}=current(),best=null,bd=Infinity;for(const e of items){let p=screen(e._x,e._y);if(level==='detail'){let w=270*scale,h=115*scale;if(px>=p.x-w/2&&px<=p.x+w/2&&py>=p.y-h/2&&py<=p.y+h/2){let d=Math.hypot(px-p.x,py-p.y);if(d<bd){best=e;bd=d}}}else{let d=Math.hypot(px-p.x,py-p.y),lim=level==='domain'?62:level==='group'?50:38;if(d<lim&&d<bd){best=e;bd=d}}}return best}
function show(e){if(!e)return;selected=e.id;selectedEntity=e;panelTitle.textContent=e.title||e.id;panelBody.textContent=`${e.entityType||''}\n${e.id}\n${e.summary||e.detail||''}`;panel.classList.add('open');draw()}
function zoom(f,cx=innerWidth/2,cy=innerHeight/2){let old=scale,n=clamp(old*f,MIN,MAX),wx=(cx-ox)/old,wy=(cy-oy)/old;scale=n;ox=cx-wx*n;oy=cy-wy*n;draw()}
function fit(){if(!graph)return;let level=directLevel(scale),items=autoLayout(entities(level),level);if(!items.length){scale=DEFAULT_SCALE;ox=innerWidth/2;oy=innerHeight/2;draw();return}let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const e of items){minX=Math.min(minX,e._x);maxX=Math.max(maxX,e._x);minY=Math.min(minY,e._y);maxY=Math.max(maxY,e._y)}let s=Math.min((innerWidth-150)/Math.max(240,maxX-minX+240),(innerHeight-150)/Math.max(180,maxY-minY+180));scale=clamp(s,.18,1.5);lastLevel=directLevel(scale);lastScale=scale;ox=innerWidth/2-(minX+maxX)/2*scale;oy=innerHeight/2-(minY+maxY)/2*scale;draw()}
function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);
c.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.2:.82,e.clientX,e.clientY)},{passive:false});
c.addEventListener('pointerdown',e=>{c.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){lastPointer={x:e.clientX,y:e.clientY};dragging=false}else if(pointers.size===2){let p=[...pointers.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};gesture={d:Math.max(10,Math.hypot(dx,dy)),s:scale,wx:(mid.x-ox)/scale,wy:(mid.y-oy)/scale}}e.preventDefault()});
c.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2&&gesture){let p=[...pointers.values()].slice(0,2),dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};scale=clamp(gesture.s*Math.hypot(dx,dy)/gesture.d,MIN,MAX);ox=mid.x-gesture.wx*scale;oy=mid.y-gesture.wy*scale;dragging=true;draw();return}if(lastPointer){let dx=e.clientX-lastPointer.x,dy=e.clientY-lastPointer.y;if(Math.abs(dx)+Math.abs(dy)>3)dragging=true;ox+=dx;oy+=dy;lastPointer={x:e.clientX,y:e.clientY};draw()}e.preventDefault()});
function up(e){let was=dragging;pointers.delete(e.pointerId);if(pointers.size<2)gesture=null;if(!pointers.size){if(!was)show(hit(e.clientX,e.clientY));lastPointer=null;dragging=false}e.preventDefault()}c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
async function load(){try{let raw=window.AminWiki?.getUnifiedGraphJson?.();if(!raw)throw Error('bridge unavailable');graph=validate(JSON.parse(raw));runtimeEdges=new Map((graph.runtimeEdges||[]).map(x=>[x.edge_id,x]));let focus=window.AminWiki?.getFocusNode?.()||'';if(focus)selected=focus;lastLevel=directLevel(scale);lastScale=scale;fit()}catch(e){graph={domains:[],groups:[],nodes:[],relations:[],runtimeEdges:[]};status.textContent='load error: '+e.message;draw()}}
function refreshRuntime(){try{let raw=window.AminWiki?.getRuntimeEdgeTraceJson?.();if(raw){let arr=JSON.parse(raw);runtimeEdges=new Map(arr.map(x=>[x.edge_id,x]));draw()}}catch(e){}}
document.getElementById('zin').onclick=()=>zoom(1.2);document.getElementById('zout').onclick=()=>zoom(.82);document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{scale=DEFAULT_SCALE;lastLevel=directLevel(scale);lastScale=scale;ox=innerWidth/2;oy=innerHeight/2;selected=null;draw()};document.getElementById('back').onclick=()=>window.AminWiki?.close?.();document.getElementById('close').onclick=()=>{panel.classList.remove('open');selected=null;selectedEntity=null;draw()};document.getElementById('inspect').onclick=()=>{if(selectedEntity)window.AminWiki?.openNodeInspector?.(selectedEntity.id)};document.getElementById('source').onclick=()=>{if(!selectedEntity)return;connectSource=selectedEntity.id;panel.classList.remove('open');window.AminWiki?.toast?.('已設定 Connect 起點');draw()};document.getElementById('connect').onclick=()=>{if(!selectedEntity||!connectSource||connectSource===selectedEntity.id){window.AminWiki?.toast?.('請先選另一顆 Entity 當起點');return}let ok=window.AminWiki?.addUnifiedEdge?.(connectSource,selectedEntity.id,'related_to');if(ok){connectSource='';panel.classList.remove('open');load();window.AminWiki?.toast?.('Connect 已建立')}else window.AminWiki?.toast?.('Connect 建立失敗')};
window.AminGraphBack=()=>{if(panel.classList.contains('open')){panel.classList.remove('open');selected=null;selectedEntity=null;draw();return true}return false};window.AminReloadUnifiedGraph=()=>{load();return true};
resize();load();setInterval(refreshRuntime,850);
})();
</script>
</body>
</html>
