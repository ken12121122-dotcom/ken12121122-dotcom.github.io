function endPointer(e){const wasNode=dragNode,moved=dragMoved;activePointers.delete(e.pointerId);if(activePointers.size<2)gesture=null;if(activePointers.size===0){dragNode=null;panLast=null;if(wasNode&&!moved)onNodeTap(wasNode)}else{const p=[...activePointers.values()][0];panLast={x:p.x,y:p.y}}e.preventDefault()}canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
function zoomAt(f,cx=innerWidth/2,cy=innerHeight/2){const old=scale,next=Math.max(.25,Math.min(3.5,old*f)),wx=(cx-offsetX)/old,wy=(cy-offsetY)/old;scale=next;offsetX=cx-wx*scale;offsetY=cy-wy*scale;draw()}function fitAll(){if(!nodes.length)return;let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const n of nodes){minX=Math.min(minX,n.x-n.w/2);maxX=Math.max(maxX,n.x+n.w/2);minY=Math.min(minY,n.y-n.h/2);maxY=Math.max(maxY,n.y+n.h/2)}const pad=70,w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY),usableW=Math.max(120,innerWidth-pad*2),usableH=Math.max(140,innerHeight-pad*2);scale=Math.max(.25,Math.min(2.2,Math.min(usableW/w,usableH/h)));offsetX=innerWidth/2-(minX+maxX)/2*scale;offsetY=innerHeight/2-(minY+maxY)/2*scale;draw()}function resetView(){expanded.clear();focus='';scale=1;offsetX=offsetY=0;applyMode(true)}function focusInitial(){if(!focus)return;const n=nodes.find(x=>x.id===focus);if(!n)return;scale=Math.max(scale,1.05);offsetX=innerWidth/2-n.x*scale;offsetY=innerHeight/2-n.y*scale;draw()}
function renderMarkdown(md){let s=esc(md).replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>');s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');return s.split(/\n{2,}/).map(b=>/^<(h\d|pre)/.test(b.trim())?b:`<p${b.includes('⚠️')?' class="warning"':''}>${b.replace(/\n/g,'<br>')}</p>`).join('')}
