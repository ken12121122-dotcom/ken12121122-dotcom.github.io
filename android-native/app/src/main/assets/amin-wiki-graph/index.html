<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Amin Unified Graph</title>
<style>
:root{color-scheme:light dark;--bg:#f6f8f7;--text:#17211b;--muted:#66736b;--line:#9eaaa3;--knowledge:#19794b;--prompt:#6b4fb3;--panel:#fff;--border:#d9e2dd;--warn:#b56a00;--focus:#d45719;--cross:#8d6f9f}
@media(prefers-color-scheme:dark){:root{--bg:#101512;--text:#eef4f0;--muted:#9caaa2;--line:#657168;--knowledge:#43a871;--prompt:#ad8cff;--panel:#171d19;--border:#2c3931;--warn:#ffb24a;--focus:#ff8b4a;--cross:#b594ca}}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--text)}
#stage{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.toolbar{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:3;display:flex;gap:7px;align-items:center;pointer-events:none}.toolbar button,.nav button{pointer-events:auto;border:1px solid var(--border);background:color-mix(in srgb,var(--panel) 94%,transparent);color:var(--text);border-radius:999px;font-weight:650}.toolbar button{padding:9px 12px;font-size:13px}.toolbar .modes{display:flex;gap:4px;flex:1;justify-content:center}.toolbar button.active{background:var(--knowledge);color:#fff}.nav{position:fixed;right:12px;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 42px);z-index:4;display:flex;flex-direction:column;gap:7px}.nav button{width:48px;height:42px;font-size:16px}.nav button.wide{width:74px;font-size:11px}.status{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--border);border-radius:999px;padding:7px 11px;font-size:11px;color:var(--muted);max-width:72%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-menu{position:fixed;z-index:8;display:none;width:34px;height:30px;border:1px solid var(--border);border-radius:999px;background:color-mix(in srgb,var(--panel) 96%,transparent);color:var(--muted);font-size:18px;line-height:24px;padding:0;opacity:.72}.article{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;overflow:auto;padding:calc(max(14px,env(safe-area-inset-top)) + 52px) 20px calc(24px + env(safe-area-inset-bottom))}.article.open{display:block}.article-close{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;z-index:11;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:10px 14px;font-weight:600}article{max-width:760px;margin:0 auto;line-height:1.72;font-size:16px}article h1{font-size:28px}article h2{font-size:21px;margin-top:28px}article pre{overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px}article code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.warning{border:1px solid var(--warn);border-radius:12px;padding:12px}
</style></head><body>
<div id="stage"><canvas id="graph"></canvas></div>
<div class="toolbar"><button id="back">返回</button><div class="modes"><button data-mode="knowledge">知識</button><button data-mode="prompt">提示詞</button><button data-mode="all">全部</button></div><button id="reload">更新</button></div>
<div class="nav"><button id="zoomIn">＋</button><button id="zoomOut">−</button><button class="wide" id="fit">Fit All</button><button class="wide" id="reset">Reset</button></div>
<button id="nodeMenu" class="node-menu">⋯</button><div id="status" class="status">準備載入</div>
<section id="article" class="article"><button id="closeArticle" class="article-close">關閉</button><article id="articleBody"></article></section>
<script>(()=>{'use strict';
const OWNER='ken12121122-dotcom',REPO='ken12121122-dotcom.github.io',REF='main',PATH='amin-wiki/pages';
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${encodeURIComponent(REF)}`;
const META=`https://${OWNER}.github.io/amin-wiki/graph/life-erp.json`;
const canvas=document.getElementById('graph'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),article=document.getElementById('article'),articleBody=document.getElementById('articleBody'),nodeMenu=document.getElementById('nodeMenu');
let docs=new Map(),metadata=null,metaNodes=[],promptNodes=[],promptLinks=[],markdownLinks=[],nodes=[],links=[],mode='knowledge',focus='',expanded=new Set(),scale=1,offsetX=0,offsetY=0,menuNode=null,menuTimer=0;
let activePointers=new Map(),gesture=null,dragNode=null,dragMoved=false,panLast=null;
try{if(window.AminWiki){mode=window.AminWiki.getGraphMode()||'knowledge';focus=window.AminWiki.getFocusNode()||'';}}catch(e){}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw()}addEventListener('resize',resize);resize();
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const baseName=p=>p.split('/').pop().replace(/\.md$/i,'');
function target(h){let t=h.split('#')[0].split('?')[0];try{t=decodeURIComponent(t)}catch(e){}t=t.replace(/^\.\//,'').replace(/^pages\//,'').replace(/^.*\/pages\//,'');return baseName(t)}
function extract(md){const f=new Set();let m;const normal=/\[[^\]]*\]\(([^)]+\.md(?:#[^)]+)?)\)/g;while((m=normal.exec(md)))f.add(target(m[1]));const wiki=/\[\[([^\]|#]+)(?:#[^\]|]+)?(?:\|[^\]]+)?\]\]/g;while((m=wiki.exec(md)))f.add(baseName(m[1].trim()));return[...f]}
async function loadDocs(){const r=await fetch(API+'&_='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(`GitHub ${r.status}`);const files=(await r.json()).filter(x=>x.type==='file'&&/\.md$/i.test(x.name));const rows=await Promise.all(files.map(async f=>{const x=await fetch(f.download_url+'?v='+Date.now(),{cache:'no-store'});if(!x.ok)throw new Error(`${f.name} ${x.status}`);return{id:baseName(f.name),name:f.name,text:await x.text()}}));docs=new Map(rows.map(x=>[x.id,x]));markdownLinks=[];for(const d of rows)for(const t of extract(d.text))if(docs.has(t)&&t!==d.id)markdownLinks.push({a:'knowledge:'+d.id,b:'knowledge:'+t,class:'cross_relation',type:'markdown_link'});}
async function loadMeta(){try{const r=await fetch(META+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(`metadata ${r.status}`);const m=await r.json();if(m.format!=='amin-hierarchical-graph'||m.version!==1)throw new Error('metadata format');metadata=m;metaNodes=(m.nodes||[]).map(n=>{const d=n.document?docs.get(n.document):null;return{id:'knowledge:'+n.id,rawId:n.id,type:'knowledge',name:n.title||n.id,text:d?.text||'',document:n.document||'',parentId:n.parentId?'knowledge:'+n.parentId:'',trunkOrder:Number.isFinite(n.trunkOrder)?n.trunkOrder:null,warn:(d?.text||'').includes('⚠️'),w:0,h:0,x:0,y:0,manual:false}});}catch(e){metadata=null;metaNodes=[...docs.values()].map(d=>({id:'knowledge:'+d.id,rawId:d.id,type:'knowledge',name:d.name,text:d.text,document:d.id,parentId:'',trunkOrder:null,warn:d.text.includes('⚠️'),w:0,h:0,x:0,y:0,manual:false}));}}
function loadPrompts(){try{const raw=window.AminWiki?window.AminWiki.getPromptGraphJson():'{"nodes":[],"links":[]}';const g=JSON.parse(raw||'{}');promptNodes=(g.nodes||[]).map(n=>({...n,warn:false,w:0,h:0,x:0,y:0,manual:false}));promptLinks=(g.links||[]).map(l=>({...l,class:'cross_relation'}));}catch(e){promptNodes=[];promptLinks=[]}}
async function loadAll(){hideMenu();status.textContent='更新中…';try{await loadDocs();await loadMeta();loadPrompts();applyMode(true);}catch(e){status.textContent='關聯圖載入失敗：'+e.message;}}
function childrenMap(){const map=new Map();for(const n of metaNodes)if(n.parentId){if(!map.has(n.parentId))map.set(n.parentId,[]);map.get(n.parentId).push(n)}return map}
function visibleKnowledge(){if(!metadata)return metaNodes;const child=childrenMap(),trunks=metaNodes.filter(n=>n.trunkOrder!==null).sort((a,b)=>a.trunkOrder-b.trunkOrder),out=[...trunks];function add(parent){if(!expanded.has(parent.id))return;for(const c of child.get(parent.id)||[]){out.push(c);add(c)}}for(const t of trunks)add(t);return out}
function hierarchyLinks(visible){const ids=new Set(visible.map(n=>n.id)),out=[];for(const n of visible)if(n.parentId&&ids.has(n.parentId))out.push({a:n.parentId,b:n.id,class:'hierarchy',type:'parent_child'});return out}
function trunkLinks(visible){const t=visible.filter(n=>n.trunkOrder!==null).sort((a,b)=>a.trunkOrder-b.trunkOrder),out=[];for(let i=1;i<t.length;i++)out.push({a:t[i-1].id,b:t[i].id,class:'trunk',type:'main_flow'});return out}
function metaCross(){if(!metadata)return[];return(metadata.relations||[]).filter(r=>r.class==='cross_relation').map(r=>({a:'knowledge:'+r.source,b:'knowledge:'+r.target,class:'cross_relation',type:r.type||'related'}))}
function applyMode(resetView){document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const knowledge=visibleKnowledge();nodes=mode==='knowledge'?[...knowledge]:mode==='prompt'?[...promptNodes]:[...knowledge,...promptNodes];const ids=new Set(nodes.map(n=>n.id));const candidate=[...trunkLinks(knowledge),...hierarchyLinks(knowledge),...metaCross(),...promptLinks];if(!metadata)candidate.push(...markdownLinks);links=candidate.filter(l=>ids.has(l.a)&&ids.has(l.b));layout();status.textContent=`${mode==='knowledge'?'知識':mode==='prompt'?'提示詞':'全部'} · ${nodes.length} 節點 · ${links.length} 關聯`;if(resetView){fitAll(false);focusInitial()}else draw()}
function measure(node,child){if(!expanded.has(node.id))return 1;const cs=child.get(node.id)||[];if(!cs.length)return 1;return Math.max(1,cs.reduce((s,c)=>s+measure(c,child),0))}
function layout(){for(const n of nodes){n.w=Math.max(96,Math.min(190,36+n.name.length*14));n.h=46}if(mode==='prompt'){layoutPromptOnly();return}const child=childrenMap(),knowledge=nodes.filter(n=>n.type==='knowledge'),trunks=knowledge.filter(n=>n.trunkOrder!==null).sort((a,b)=>a.trunkOrder-b.trunkOrder);if(metadata&&trunks.length){let cursor=0;const ROW=70,GAP=44,DX=205;function placeBranch(parent,depth,start){const cs=(child.get(parent.id)||[]).filter(c=>nodes.some(n=>n.id===c.id));if(!cs.length||!expanded.has(parent.id))return;let y=start;for(const c of cs){const units=measure(c,child),height=units*ROW;c.x=depth*DX;c.y=y+height/2;placeBranch(c,depth+1,y);y+=height}}for(const t of trunks){const units=Math.max(1,expanded.has(t.id)?(child.get(t.id)||[]).reduce((s,c)=>s+measure(c,child),0):1),height=Math.max(ROW,units*ROW);t.x=0;t.y=cursor+height/2;placeBranch(t,1,cursor);cursor+=height+GAP}const prompts=nodes.filter(n=>n.type==='prompt');let py=0;for(const p of prompts){p.x=620;p.y=py+36;py+=72}}else{layoutFallback(knowledge);const prompts=nodes.filter(n=>n.type==='prompt');let y=0;for(const p of prompts){p.x=500;p.y=y;y+=70}}}
function layoutFallback(list){const cols=Math.max(1,Math.ceil(Math.sqrt(list.length)));list.forEach((n,i)=>{n.x=(i%cols)*190;n.y=Math.floor(i/cols)*82})}
function layoutPromptOnly(){const cols=Math.max(1,Math.min(3,Math.ceil(Math.sqrt(nodes.length))));nodes.forEach((n,i)=>{n.x=(i%cols)*205;n.y=Math.floor(i/cols)*76})}
function worldToScreen(n){return{x:n.x*scale+offsetX,y:n.y*scale+offsetY}}
function screenToWorld(x,y){return{x:(x-offsetX)/scale,y:(y-offsetY)/scale}}
function roundRect(x,y,w,h,r){const rr=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+rr,y);ctx.arcTo(x+w,y,x+w,y+h,rr);ctx.arcTo(x+w,y+h,x,y+h,rr);ctx.arcTo(x,y+h,x,y,rr);ctx.arcTo(x,y,x+w,y,rr);ctx.closePath()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);const css=getComputedStyle(document.documentElement),by=new Map(nodes.map(n=>[n.id,n]));for(const l of links){const aa=by.get(l.a),bb=by.get(l.b);if(!aa||!bb)continue;const a=worldToScreen(aa),b=worldToScreen(bb);ctx.save();ctx.lineWidth=l.class==='trunk'?2.7:l.class==='hierarchy'?1.8:1.2;ctx.strokeStyle=l.class==='cross_relation'?css.getPropertyValue('--cross').trim():css.getPropertyValue('--line').trim();ctx.globalAlpha=l.class==='cross_relation'?.55:.82;if(l.class==='cross_relation')ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
for(const n of nodes){const p=worldToScreen(n),w=n.w*scale,h=n.h*scale,x=p.x-w/2,y=p.y-h/2,isFocus=n.id===focus,hasKids=metaNodes.some(c=>c.parentId===n.id),isOpen=expanded.has(n.id);ctx.save();roundRect(x,y,w,h,Math.max(8,13*scale));ctx.fillStyle=n.type==='prompt'?css.getPropertyValue('--prompt').trim():isFocus?css.getPropertyValue('--focus').trim():css.getPropertyValue('--panel').trim();ctx.strokeStyle=n.type==='prompt'?css.getPropertyValue('--prompt').trim():css.getPropertyValue('--knowledge').trim();ctx.lineWidth=isFocus?3:1.7;ctx.fill();ctx.stroke();ctx.fillStyle=n.type==='prompt'||isFocus?'#fff':css.getPropertyValue('--text').trim();ctx.font=`600 ${Math.max(10,13*scale)}px -apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';const label=(hasKids?(isOpen?'− ':'＋ '):'')+n.name;ctx.fillText(label,p.x,p.y,Math.max(50,w-14));ctx.restore()}positionMenu()}
function hitNode(x,y){for(let i=nodes.length-1;i>=0;i--){const n=nodes[i],p=worldToScreen(n),w=n.w*scale,h=n.h*scale;if(x>=p.x-w/2-8&&x<=p.x+w/2+8&&y>=p.y-h/2-8&&y<=p.y+h/2+8)return n}return null}
function onNodeTap(n){const hasKids=metaNodes.some(c=>c.parentId===n.id);if(hasKids){if(expanded.has(n.id))expanded.delete(n.id);else expanded.add(n.id);applyMode(false)}showMenu(n)}
function showMenu(n){menuNode=n;clearTimeout(menuTimer);const canOpen=n.type==='prompt'||!!n.text;if(!canOpen){hideMenu();return}nodeMenu.style.display='block';positionMenu();menuTimer=setTimeout(hideMenu,3300)}
function hideMenu(){clearTimeout(menuTimer);menuNode=null;nodeMenu.style.display='none'}
function positionMenu(){if(!menuNode||nodeMenu.style.display==='none')return;const p=worldToScreen(menuNode),w=menuNode.w*scale;nodeMenu.style.left=Math.max(4,Math.min(innerWidth-38,p.x+w/2-13))+'px';nodeMenu.style.top=Math.max(52,Math.min(innerHeight-40,p.y-menuNode.h*scale/2-8))+'px'}
nodeMenu.onclick=e=>{e.stopPropagation();const n=menuNode;hideMenu();if(!n)return;if(n.type==='prompt'){try{window.AminWiki.openPrompt(n.rawId)}catch(e){}return}if(n.text){articleBody.innerHTML=renderMarkdown(n.text);article.classList.add('open')}};
function pointerPoint(e){return{x:e.clientX,y:e.clientY}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture?.(e.pointerId);activePointers.set(e.pointerId,pointerPoint(e));hideMenu();dragMoved=false;if(activePointers.size===1){dragNode=hitNode(e.clientX,e.clientY);panLast={x:e.clientX,y:e.clientY}}else if(activePointers.size===2){dragNode=null;const ps=[...activePointers.values()],dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y,mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};gesture={distance:Math.max(10,Math.hypot(dx,dy)),scale,anchor:screenToWorld(mid.x,mid.y),mid};}e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,pointerPoint(e));if(activePointers.size>=2&&gesture){const ps=[...activePointers.values()].slice(0,2),dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y,mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2},newScale=Math.max(.25,Math.min(3.5,gesture.scale*Math.hypot(dx,dy)/gesture.distance));scale=newScale;offsetX=mid.x-gesture.anchor.x*scale;offsetY=mid.y-gesture.anchor.y*scale;dragMoved=true;draw();return}if(activePointers.size===1&&panLast){const dx=e.clientX-panLast.x,dy=e.clientY-panLast.y;if(Math.abs(dx)+Math.abs(dy)>3)dragMoved=true;if(dragNode){dragNode.x+=dx/scale;dragNode.y+=dy/scale;dragNode.manual=true}else{offsetX+=dx;offsetY+=dy}panLast={x:e.clientX,y:e.clientY};draw()}e.preventDefault()});
function endPointer(e){const wasNode=dragNode,moved=dragMoved;activePointers.delete(e.pointerId);if(activePointers.size<2)gesture=null;if(activePointers.size===0){dragNode=null;panLast=null;if(wasNode&&!moved)onNodeTap(wasNode)}else{const p=[...activePointers.values()][0];panLast={x:p.x,y:p.y}}e.preventDefault()}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
function zoomAt(f,cx=innerWidth/2,cy=innerHeight/2){const old=scale,next=Math.max(.25,Math.min(3.5,old*f));const wx=(cx-offsetX)/old,wy=(cy-offsetY)/old;scale=next;offsetX=cx-wx*scale;offsetY=cy-wy*scale;draw()}
function fitAll(animate=true){if(!nodes.length)return;let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const n of nodes){minX=Math.min(minX,n.x-n.w/2);maxX=Math.max(maxX,n.x+n.w/2);minY=Math.min(minY,n.y-n.h/2);maxY=Math.max(maxY,n.y+n.h/2)}const pad=70,w=Math.max(1,maxX-minX),h=Math.max(1,maxY-minY),usableW=Math.max(120,innerWidth-pad*2),usableH=Math.max(140,innerHeight-pad*2);scale=Math.max(.25,Math.min(2.2,Math.min(usableW/w,usableH/h)));offsetX=innerWidth/2-(minX+maxX)/2*scale;offsetY=innerHeight/2-(minY+maxY)/2*scale;draw()}
function resetView(){expanded.clear();focus='';scale=1;offsetX=offsetY=0;applyMode(true)}
function focusInitial(){if(!focus)return;const n=nodes.find(x=>x.id===focus);if(!n)return;scale=Math.max(scale,1.05);offsetX=innerWidth/2-n.x*scale;offsetY=innerHeight/2-n.y*scale;draw()}
function renderMarkdown(md){let s=esc(md).replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>');s=s.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');return s.split(/\n{2,}/).map(b=>/^<(h\d|pre)/.test(b.trim())?b:`<p${b.includes('⚠️')?' class="warning"':''}>${b.replace(/\n/g,'<br>')}</p>`).join('')}
document.getElementById('closeArticle').onclick=()=>article.classList.remove('open');document.getElementById('reload').onclick=()=>loadAll();document.getElementById('back').onclick=()=>{if(article.classList.contains('open'))article.classList.remove('open');else if(window.AminWiki)window.AminWiki.close();else history.back()};document.getElementById('zoomIn').onclick=()=>zoomAt(1.22);document.getElementById('zoomOut').onclick=()=>zoomAt(.82);document.getElementById('fit').onclick=()=>fitAll();document.getElementById('reset').onclick=()=>resetView();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;expanded.clear();focus='';applyMode(true)});loadAll();
})();</script></body></html>
