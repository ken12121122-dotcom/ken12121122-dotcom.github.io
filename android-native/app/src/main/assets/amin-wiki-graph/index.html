function pointerDown(e){c.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});hideDots();dragMoved=false;if(pointers.size===1){let n=hit(e.clientX,e.clientY);dragNode=n;last={x:e.clientX,y:e.clientY};if(edit&&n?.origin==='app'){if(edgeMode){selectForEdge(n);dragNode=null;return}beginLong(n)}}else if(pointers.size===2){clearTimeout(longTimer);dragNode=null;let p=[...pointers.values()],dx=p[1].x-p[0].x,dy=p[1].y-p[0].y,mid={x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2};gesture={d:Math.max(10,Math.hypot(dx,dy)),s:scale,wx:(mid.x-ox)/scale,wy:(mid.y-oy)/scale}}e.preventDefault()}

function zoom(f,cx=innerWidth/2,cy=innerHeight/2){let old=scale,n=Math.max(.25,Math.min(3.5,old*f)),wx=(cx-ox)/old,wy=(cy-oy)/old;scale=n;ox=cx-wx*n;oy=cy-wy*n;draw()}function fit(){if(!nodes.length)return;let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const n of nodes){minX=Math.min(minX,n.x-n.w/2);maxX=Math.max(maxX,n.x+n.w/2);minY=Math.min(minY,n.y-n.h/2);maxY=Math.max(maxY,n.y+n.h/2)}let pad=80;scale=Math.max(.22,Math.min(1.8,Math.min((innerWidth-pad*2)/Math.max(1,maxX-minX),(innerHeight-pad*2)/Math.max(1,maxY-minY))));ox=innerWidth/2-(minX+maxX)/2*scale;oy=innerHeight/2-(minY+maxY)/2*scale;draw()}function resize(){let d=Math.min(devicePixelRatio||1,2);c.width=innerWidth*d;c.height=innerHeight*d;ctx.setTransform(d,0,0,d,0,0);draw()}addEventListener('resize',resize);resize();
